      const actions = '<button class="btn btn-outline" type="button" onclick="showDashboard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>重新统计</button>';
      const panelBody = moduleFiles === 0
        ? `<div class="dashboard-empty-module"><strong>${activeDefinition.label}暂无文件</strong>${escapeHtml(activeDefinition.empty)}</div>`
        : `<div class="dashboard-panel-grid">
            ${renderDashboardEpisodes(moduleEpisodeFolders, moduleEpisodeWordDocuments)}
            ${renderDashboardAudioPie(moduleAudio)}
          </div>`;

      const area = document.getElementById('previewArea');
      area.innerHTML = `<div class="dashboard">
        ${renderDashboardHeader(currentRoot, actions, `更新于 ${generatedAt}`)}
        ${renderDashboardModuleCards(activeDefinition.key, data)}
        <section class="dashboard-panel module-${activeDefinition.key}" id="dashboardViewPanel" role="tabpanel" aria-labelledby="dashboardTab-${activeDefinition.key}">
          <div class="dashboard-panel-title"><i aria-hidden="true"></i>${activeDefinition.label} · 明细</div>
          ${panelBody}
        </section>

        <div class="dashboard-scan-meta">${escapeHtml(scanMeta)}。统计仅按文件名和路径进行只读扫描，不会修改文件。</div>
        ${skipped.length > 0 ? `<div class="dashboard-warning">有 ${skipped.length} 个路径无法读取，以上结果不包含这些项目。</div>${renderIssueDetails([], skipped)}` : ''}
      </div>`;
      area.scrollTop = 0;
    }

    function showDashboard() {
      if (!currentRoot) {
        showToast('目录尚未加载完成，请稍后再试', 'info');
        return;
      }

      stopDashboardRequest();
      previewRequestId++;
      if (activePreviewController) activePreviewController.abort();
      activePreviewController = null;
      clearWordPreviewListeners();
      stopAudioPreview();
      if (activeLabel) activeLabel.classList.remove('active');
      activeLabel = null;
      currentContentView = 'dashboard';
      setDashboardButtonActive(true);
      dashboardActiveModule = 'normal';

      const requestId = ++dashboardRequestId;
      const requestRoot = currentRoot;
      const requestRootContextId = rootContextId;
      const scan = { controller: new AbortController(), cancelled: false };
      activeDashboardScan = scan;
      renderDashboardLoading(requestRoot);

      ssePost('/api/dashboard-stats', { root: requestRoot }, {
        signal: scan.controller.signal,
        onProgress(message) {
          if (activeDashboardScan !== scan || requestId !== dashboardRequestId || requestRoot !== currentRoot) return;
          updateDashboardProgress(message);
        },
        onDone(data) {
          if (scan.cancelled || requestId !== dashboardRequestId || requestRootContextId !== rootContextId || requestRoot !== currentRoot) return;
          if (activeDashboardScan === scan) activeDashboardScan = null;
          if (!data.success) {
            renderDashboardState('统计失败', data.error || '服务器未能完成统计，请重新尝试。');
            return;
          }
          renderDashboard(data);
        },
        onError(error) {
          if (scan.cancelled || error.name === 'AbortError' || requestId !== dashboardRequestId || requestRoot !== currentRoot) return;
          if (activeDashboardScan === scan) activeDashboardScan = null;
          renderDashboardState('统计失败', error.message || '连接已中断，请重新尝试。');
        }
      });
    }

    function renderPreviewTitle(data, fallbackName) {
      const typeLabels = { excel: 'Excel', word: 'Word', audio: '音频', text: '文本', image: '图片' };
      const parts = [];
      if (typeLabels[data.type]) parts.push(typeLabels[data.type]);
      if (Number.isFinite(data.size)) parts.push(formatFileSize(data.size));
      const time = formatFileTime(data.mtime);
      if (time) parts.push(`修改于 ${time}`);
      const copyButton = currentPreviewPath ? '<button type="button" class="btn btn-outline btn-xs" onclick="copyText(currentPreviewPath, \'文件路径已复制\')" title="复制完整路径">复制路径</button>' : '';
      return `<div class="preview-title"><span class="preview-title-name">${escapeHtml(data.fileName || fallbackName || '')}</span><span class="preview-title-side"><span class="preview-title-meta">${escapeHtml(parts.join(' · '))}</span>${copyButton}</span></div>`;
    }

    function renderResultSummary(summary = {}) {
      const success = Number(summary.success) || 0;
      const skipped = Number(summary.skipped) || 0;
      const failed = Number(summary.failed) || 0;
      return `<div class="result-summary">
        <div class="result-summary-item success"><span class="result-summary-count">${success}</span><span class="result-summary-label">成功</span></div>
        <div class="result-summary-item skipped"><span class="result-summary-count">${skipped}</span><span class="result-summary-label">跳过</span></div>
        <div class="result-summary-item failed"><span class="result-summary-count">${failed}</span><span class="result-summary-label">失败</span></div>
      </div>`;
    }

    function renderIssueDetails(skipped = [], errors = []) {
      const items = [];
      skipped.forEach(item => items.push({ kind: '跳过', file: item.file || item.path || '', detail: item.reason || item.error || '无法读取' }));
      errors.forEach(item => items.push({ kind: '失败', file: item.file || item.path || '', detail: item.error || item.reason || '未知错误' }));
      if (items.length === 0) return '';
      const rows = items.map(item => `<div class="issue-row"><strong>${escapeHtml(item.kind)}</strong> · ${escapeHtml(item.file)}<br>${escapeHtml(item.detail)}</div>`).join('');
      return `<details class="issue-details" ${errors.length > 0 ? 'open' : ''}><summary>查看异常详情（${items.length} 项）</summary><div class="issue-details-body"><div class="issue-details-tools"><button type="button" class="btn btn-outline btn-xs" onclick="copyIssueDetails(this)">复制异常信息</button></div>${rows}</div></details>`;
    }

    function renderScanSummary({ totalScanned = 0, found = 0, skipped = [], errors = [], unit = '个文件' }) {
      return `<p>扫描 <strong>${totalScanned}</strong> ${unit} · 找到 <strong>${found}</strong> 个 · 跳过 <strong>${skipped.length}</strong> 项 · 读取失败 <strong>${errors.length}</strong> 项</p>${renderIssueDetails(skipped, errors)}`;
    }

    function showTaskProgress(title, message = '准备开始', cancellable = false) {
      showModal(title, `<div class="task-progress">
        <div id="taskProgressText">${escapeHtml(message)}</div>
        <div class="task-progress-bar indeterminate" id="taskProgressBarTrack"><span id="taskProgressBar"></span></div>
        <div id="taskProgressFile" class="task-current-file"></div>
        ${cancellable ? '<div class="task-progress-actions"><button class="btn btn-danger" type="button" onclick="cancelActiveScan()">取消扫描</button></div>' : ''}
      </div>`);
    }

    function showTaskError(title, message) {
      showModal(title, `<div class="result-item error"><div class="result-file">操作未完成</div><div class="result-detail">${escapeHtml(message)}</div></div>`);
    }

    function updateTaskProgress(current, total, file, label) {
      const text = document.getElementById('taskProgressText');
      const bar = document.getElementById('taskProgressBar');
      const track = document.getElementById('taskProgressBarTrack');
      const currentFile = document.getElementById('taskProgressFile');
      const pct = total > 0 ? Math.round(current / total * 100) : 0;
      if (text) text.textContent = total > 0 ? `${label} ${current}/${total}（${pct}%）` : `${label} ${current} 个文件`;
      if (track) track.classList.toggle('indeterminate', total <= 0);
      if (bar && total > 0) bar.style.width = `${pct}%`;
      if (currentFile) currentFile.textContent = file || '';
    }

    function beginCancellableScan(title, message, onCancel) {
      if (activeScan) {
        const previous = activeScan;
        previous.cancelled = true;
        previous.controller.abort();
        if (previous.onCancel) previous.onCancel();
      }
      const scan = { controller: new AbortController(), cancelled: false, title, onCancel };
      activeScan = scan;
      showTaskProgress(title, message, true);
      return scan;
    }

    function finishScan(scan) {
      if (activeScan === scan) activeScan = null;
      return !scan.cancelled;
    }

    function cancelActiveScan(showResult = true) {
      const scan = activeScan;
      if (!scan) return;
      scan.cancelled = true;
      activeScan = null;
      scan.controller.abort();
      if (scan.onCancel) scan.onCancel();
      if (showResult) {
        showModal(scan.title, '<div class="result-item info"><div class="result-file">扫描已取消</div><div class="result-detail">没有执行任何文件修改。</div></div>');
      } else {
        showToast('扫描已取消，没有修改文件', 'info');
      }
    }

    function selectedIndexes(selector) {
      return [...document.querySelectorAll(selector + ':checked')].map(el => Number(el.value));
    }

    function updateSelectionControls({ selector, actionButtonId, selectAllButtonId, clearAllButtonId, summaryId, actionPrefix, itemLabel }) {
      const options = [...document.querySelectorAll(`.${selector}`)].filter(option => !option.disabled);
      const selectedCount = options.filter(option => option.checked).length;
      const totalCount = options.length;
      const actionButton = document.getElementById(actionButtonId);
      const selectAllButton = document.getElementById(selectAllButtonId);
      const clearAllButton = document.getElementById(clearAllButtonId);
      const summary = document.getElementById(summaryId);

      if (actionButton) {
        actionButton.textContent = `${actionPrefix} ${selectedCount} 个${itemLabel}`;
        actionButton.disabled = totalCount === 0 || selectedCount === 0;
      }
      if (selectAllButton) selectAllButton.disabled = totalCount === 0 || selectedCount === totalCount;
      if (clearAllButton) clearAllButton.disabled = totalCount === 0 || selectedCount === 0;
      if (summary) summary.textContent = totalCount === 0
        ? '没有可选项'
        : `已选择 ${selectedCount} / ${totalCount} 个${itemLabel}`;
    }

    function setSelection(selector, checked, update) {
      const options = [...document.querySelectorAll(`.${selector}`)].filter(option => !option.disabled);
      if (options.length === 0) {
        update();
        return;
      }
      options.forEach(option => { option.checked = checked; });
      update();
    }

    function updateAudioSelection() {
      updateSelectionControls({
        selector: 'audio-select',
        actionButtonId: 'audioActionButton',
        selectAllButtonId: 'audioSelectAllButton',
        clearAllButtonId: 'audioClearAllButton',
        summaryId: 'audioSelectionSummary',
        actionPrefix: '移动选中的',
        itemLabel: '音频'
      });
    }

    function updateDocumentSelection() {
      updateSelectionControls({
        selector: 'document-select',
        actionButtonId: 'documentActionButton',
        selectAllButtonId: 'documentSelectAllButton',
        clearAllButtonId: 'documentClearAllButton',
        summaryId: 'documentSelectionSummary',
        actionPrefix: '处理选中的',
        itemLabel: '文档'
      });
    }

    // ===== Button 1: Organize revoked audio =====
    function moveRevokedFiles() {
      const btn = document.getElementById('btnMoveRevoked');
      const resetButton = () => {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> 删除需要撤回的返场故事录音';
      };
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div> 扫描中...';
      const scan = beginCancellableScan('扫描撤回音频', '正在查找文件名包含“撤回”的音频', resetButton);
      ssePost('/api/scan-revoked-audio', { root: currentRoot }, {
        signal: scan.controller.signal,
        onProgress(msg) { updateTaskProgress(msg.current, msg.total, msg.file, msg.phase === 'fingerprint' ? '校验文件' : '已扫描'); },
        onDone(data) {
          if (!finishScan(scan)) return;
          resetButton();
          if (!data.success) return showTaskError('扫描撤回音频失败', data.error || '服务器未能完成扫描');
          const skipped = Array.isArray(data.skipped) ? data.skipped : [];
          const errors = Array.isArray(data.errors) ? data.errors : [];
          audioCandidates = Array.isArray(data.data) ? data.data : [];
          const scanSummary = renderScanSummary({ totalScanned: data.totalScanned, found: audioCandidates.length, skipped, errors, unit: '个文件' });
          if (audioCandidates.length === 0) {
            showModal('整理撤回音频', scanSummary + '<div class="result-item info"><div class="result-file">没有找到文件名包含“撤回”的音频文件</div><div class="result-detail">当前没有可选项，无需进行整理。</div></div>');
            return;
          }
          let content = scanSummary + `<div class="selection-toolbar"><span class="selection-summary" id="audioSelectionSummary">已选择 ${audioCandidates.length} / ${audioCandidates.length} 个音频</span><div class="selection-toolbar-actions"><button id="audioSelectAllButton" class="btn" type="button" onclick="setSelection('audio-select', true, updateAudioSelection)" disabled>全选</button><button id="audioClearAllButton" class="btn" type="button" onclick="setSelection('audio-select', false, updateAudioSelection)">取消全选</button></div></div><div class="selection-list">`;
          audioCandidates.forEach((item, index) => {
            content += `<label class="selection-row"><input class="audio-select" type="checkbox" value="${index}" checked onchange="updateAudioSelection()"><span><span class="selection-file">${escapeHtml(item.relativePath)}</span><span class="selection-detail">${formatFileSize(item.size)} · 修改于 ${escapeHtml(formatFileTime(item.mtime))}</span></span></label>`;
          });
          content += `</div><div style="display:flex;justify-content:flex-end;"><button id="audioActionButton" class="btn btn-primary" onclick="executeSelectedAudio()">移动选中的 ${audioCandidates.length} 个音频</button></div>`;
          showModal('选择要整理的撤回音频', content);
          updateAudioSelection();
        },
        onError(e) {
          if (scan.cancelled || e.name === 'AbortError') return;
          finishScan(scan);
          resetButton();
          showTaskError('扫描撤回音频失败', e.message);
        }
      });
    }

    async function executeSelectedAudio() {
      const selected = selectedIndexes('.audio-select').map(index => audioCandidates[index]).filter(Boolean);
      const items = selected.map(item => ({ file: item.file, size: item.size, mtimeMs: item.mtimeMs, sha256: item.sha256 }));
      if (items.length === 0) return showToast('请至少选择一个音频文件', 'info');
      const ok = await showConfirm({
        title: '确认移动撤回音频',
        message: `即将把 ${items.length} 个音频移动到“撤回文件夹”，请核对清单。`,
        type: 'warning',
        okText: `确认移动 ${items.length} 个音频`,
        itemLabel: '音频',
        items: selected.map(item => item.relativePath || item.file),
        points: [
          '音频会离开原位置，移动到当前目录下的“撤回文件夹”',
          '目标位置有同名文件时自动编号，不会覆盖',
          '完成后可在结果页或操作日志中一键撤回'
        ],
        acknowledge: '我已核对上面的音频清单，确认移动'
      });
      if (!ok) return;
      closeModal();
      const btn = document.getElementById('btnMoveRevoked');
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div> 整理中...';
      showTaskProgress('整理撤回音频');
      ssePost('/api/move-revoked', { root: currentRoot, items }, {
        onProgress(msg) { updateTaskProgress(msg.current, msg.total, msg.file, '移动中'); },
        onDone(data) {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> 删除需要撤回的返场故事录音';
          if (!data.success) return showTaskError('整理撤回音频失败', data.error || '服务器未能完成操作');
          const skipped = Array.isArray(data.skipped) ? data.skipped : [];
          const errors = Array.isArray(data.errors) ? data.errors : [];
          const warnings = Array.isArray(data.warnings) ? data.warnings : [];
          let content = renderResultSummary(data.summary);
          if (data.restorable) content += `<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="restoreTask('${data.taskId}', 'move-audio')">撤回本次整理</button></div>`;
          content += `<p>音频目标位置：<code>${escapeHtml(data.targetDir)}</code></p>`;
          data.moved.forEach(item => { content += `<div class="result-item success"><div class="result-file">${escapeHtml(item.from.split('/').pop())}</div><div class="result-detail">已移动到：${escapeHtml(item.to)}</div></div>`; });
          skipped.forEach(item => { content += `<div class="result-item info"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">已跳过：${escapeHtml(item.reason)}</div></div>`; });
          warnings.forEach(item => { content += `<div class="result-item info"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">提示：${escapeHtml(item.reason)}</div></div>`; });
          errors.forEach(item => { content += `<div class="result-item error"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">错误：${escapeHtml(item.error)}</div></div>`; });
          showModal('整理撤回音频结果', content);
          loadTree();
        },
        onError(e) {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> 删除需要撤回的返场故事录音';
          showTaskError('整理撤回音频失败', e.message);
        }
      });
    }

    // ===== Button 2: Scan and process revoked documents =====
    function processRevokedDocuments() {
      const btn = document.getElementById('btnProcessDocuments');
      const resetButton = () => {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 删除需要撤回的返场故事段落';
      };
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div> 扫描中...';
      const scan = beginCancellableScan('扫描撤回文档', '正在查找同时包含“返场故事”和“撤回”的 Word 段落', resetButton);
      ssePost('/api/find-keywords', { root: currentRoot }, {
        signal: scan.controller.signal,
        onProgress(msg) { updateTaskProgress(msg.current, msg.total, msg.file, msg.phase === 'inspect' ? '检查文档' : '已扫描'); },
        onDone(data) {
          if (!finishScan(scan)) return;
          resetButton();
          if (!data.success) return showTaskError('扫描撤回文档失败', data.error || '服务器未能完成扫描');
          const skipped = Array.isArray(data.skipped) ? data.skipped : [];
          const errors = Array.isArray(data.errors) ? data.errors : [];
          documentCandidates = Array.isArray(data.data) ? data.data : [];
          const scanSummary = renderScanSummary({ totalScanned: data.totalScanned, found: documentCandidates.length, skipped, errors, unit: '个 Word 文档' });
          if (documentCandidates.length === 0) {
            showModal('处理撤回文档', scanSummary + '<div class="result-item info"><div class="result-file">没有找到匹配段落</div><div class="result-detail">当前没有可选项，无需进行处理。</div></div>');
            return;
          }
          let content = scanSummary + `<div class="danger-note">删除范围：从命中“返场故事 + 撤回”的段落开始，删除该段及其后的全部内容。原文件会先备份。</div><div class="selection-toolbar"><span class="selection-summary" id="documentSelectionSummary">已选择 ${documentCandidates.length} / ${documentCandidates.length} 个文档</span><div class="selection-toolbar-actions"><button id="documentSelectAllButton" class="btn" type="button" onclick="setSelection('document-select', true, updateDocumentSelection)" disabled>全选</button><button id="documentClearAllButton" class="btn" type="button" onclick="setSelection('document-select', false, updateDocumentSelection)">取消全选</button></div></div><div class="selection-list">`;
          documentCandidates.forEach((item, index) => {
            content += `<label class="selection-row"><input class="document-select" type="checkbox" value="${index}" checked onchange="updateDocumentSelection()"><span><button class="selection-file doc-preview-link" type="button" onclick="previewDocumentCandidate(${index})">${escapeHtml(item.relativePath || item.file)}</button>`;
            item.matchedLines.forEach(line => { content += `<span class="selection-detail">第 ${line.lineNumber} 行：${escapeHtml(line.content)}</span>`; });
            content += `<span class="selection-detail">${formatFileSize(item.size)} · 修改于 ${escapeHtml(formatFileTime(item.mtime))}</span>`;
            content += '</span></label>';
          });
          content += `</div><div style="display:flex;justify-content:flex-end;"><button id="documentActionButton" class="btn btn-danger" onclick="executeSelectedDocuments()">处理选中的 ${documentCandidates.length} 个文档</button></div>`;
          showModal('选择要处理的撤回文档', content);
          updateDocumentSelection();
        },
        onError(e) {
          if (scan.cancelled || e.name === 'AbortError') return;
          finishScan(scan);
          resetButton();
          showTaskError('扫描撤回文档失败', e.message);
        }
      });
    }

    function previewDocumentCandidate(index) {
      const item = documentCandidates[index];
      if (!item) return;
      closeModal();
      previewFile(item.file, (item.relativePath || item.file).split('/').pop());
    }

    async function executeSelectedDocuments() {
      const selected = selectedIndexes('.document-select').map(index => documentCandidates[index]).filter(Boolean);
      const items = selected.map(item => ({ file: item.file, size: item.size, mtimeMs: item.mtimeMs, sha256: item.sha256 }));
      if (items.length === 0) return showToast('请至少选择一个 Word 文档', 'info');
      const ok = await showConfirm({
        title: '确认删除撤回段落',
        message: `即将修改 ${items.length} 个 Word 文档，删除后正文内容会减少，请核对清单。`,
        type: 'danger',
        okText: `确认删除 ${items.length} 个文档的段落`,
        itemLabel: 'Word 文档',
        items: selected.map(item => item.relativePath || item.file),
        points: [
          '从命中“返场故事 + 撤回”的段落开始，删除该段及其后的全部内容',
          '修改前原文件会先备份到“备份文件夹”，可在结果页或操作日志中一键恢复',
          '扫描后内容发生变化的文件会自动跳过'
        ],
        acknowledge: '我已了解删除范围，确认删除这些文档中的段落'
      });
      if (!ok) return;
      closeModal();
      const btn = document.getElementById('btnProcessDocuments');
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div> 处理中...';
      showTaskProgress('处理撤回文档');
      ssePost('/api/remove-content', { root: currentRoot, items }, {
        onProgress(msg) { updateTaskProgress(msg.current, msg.total, msg.file, '处理第'); },
        onDone(data) {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 删除需要撤回的返场故事段落';
          if (!data.success) return showTaskError('处理撤回文档失败', data.error || '服务器未能完成操作');
          let content = renderResultSummary(data.summary);
          const warnings = Array.isArray(data.warnings) ? data.warnings : [];
          warnings.forEach(warning => {
            content += `<div class="result-item info"><div class="result-file">操作日志提示</div><div class="result-detail">${escapeHtml(warning)}</div></div>`;
          });
          data.data.forEach(item => {
            if (item.modified) content += `<div class="result-item success"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">已删除 ${item.removedParagraphs} 个段落<br>备份：${escapeHtml(item.backupPath)}${item.warning ? `<br>提示：${escapeHtml(item.warning)}` : ''}</div></div>`;
            else if (item.skipped || (item.reason && !item.error)) content += `<div class="result-item info"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">已跳过：${escapeHtml(item.reason || '未修改')}</div></div>`;
            else content += `<div class="result-item error"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">${escapeHtml(item.error || '处理失败')}</div></div>`;
          });
          if (data.restorable) content = `<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="btn btn-primary" onclick="restoreTask('${data.taskId}', 'remove-content')">恢复本次修改</button></div>` + content;
          showModal('处理撤回文档结果', content || '<div class="result-item info"><div class="result-file">没有完成修改</div></div>');
          const count = data.data.filter(item => item.modified).length;
          showToast(`处理完成：${count} 个文件已修改`, count > 0 ? 'success' : 'info');
          loadTree();
        },
        onError(e) {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 删除需要撤回的返场故事段落';
          showTaskError('处理撤回文档失败', e.message);
        }
      });
    }

    async function restoreTask(taskId, taskType = 'remove-content') {
      const isAudio = taskType === 'move-audio';
      const ok = await showConfirm({
        title: isAudio ? '撤回本次音频整理' : '恢复本次文档修改',
        message: isAudio
          ? '将把音频移回整理前的位置。原位置已有同名文件时不会覆盖，而会安全跳过。'
          : '将使用备份覆盖当前文档。当前版本会先另行备份，确认恢复？',
        type: 'warning',
        okText: isAudio ? '确认撤回' : '确认恢复'
      });
      if (!ok) return;
      closeModal();
      showTaskProgress(isAudio ? '撤回音频整理' : '恢复文档备份', '正在恢复文件');
      try {
        const resp = await fetch('/api/restore-task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ root: currentRoot, taskId }) });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error);
        let content = renderResultSummary(data.summary);
        if (data.warning) content += `<div class="result-item info"><div class="result-file">任务记录提示</div><div class="result-detail">${escapeHtml(data.warning)}</div></div>`;
        data.data.forEach(item => {
          const className = item.restored ? 'success' : item.skipped ? 'info' : 'error';
          const detail = item.restored ? `恢复成功${item.warning ? `；${item.warning}` : ''}` : item.skipped ? `已跳过：${item.reason}` : `恢复失败：${item.error}`;
          content += `<div class="result-item ${className}"><div class="result-file">${escapeHtml(item.file)}</div><div class="result-detail">${escapeHtml(detail)}</div></div>`;
        });
        showModal(isAudio ? '撤回音频整理结果' : '恢复文档结果', content);
        loadTree();
      } catch (e) {
        showTaskError(isAudio ? '撤回音频整理失败' : '恢复文档失败', e.message);
      }
    }

    // ===== 查看操作日志 =====
    async function viewLogs() {
      try {
        const root = currentRoot || document.getElementById('rootPath').value.trim();
        const [resp, backupsResp] = await Promise.all([
          fetch(`/api/logs?root=${encodeURIComponent(root)}`),
          fetch(`/api/backups?root=${encodeURIComponent(root)}`)
        ]);
        const data = await resp.json();
        const backupsData = await backupsResp.json();
        const backups = backupsData.success ? backupsData.data : [];
        if (!data.success) { showToast('获取日志列表失败: ' + data.error, 'error'); return; }
        let content = '<div class="log-shell">';
        if (backups.length > 0) {
          const tasks = [...backups].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
          content += `<section><div class="log-section-head"><h4>可恢复的任务</h4><span>${tasks.length} 个任务 · 恢复前会再次确认</span></div><div class="log-tasks">`;
          tasks.forEach(task => {
            const meta = LOG_TASK_TYPES[task.type] || LOG_TASK_TYPES['remove-content'];
            content += `<div class="log-task" style="--task-color:${meta.color}">
              <span class="log-task-seal" aria-hidden="true">${meta.seal}</span>
              <span class="log-task-info"><b>${meta.label} · ${task.count} 个文件</b><small>${escapeHtml(formatFileTime(task.createdAt))}</small></span>
              <button class="btn btn-outline btn-xs" type="button" onclick="restoreTask(${inlineJsString(task.taskId)}, ${inlineJsString(task.type)})">${meta.action}</button>
            </div>`;
          });
          content += '</div></section>';
        }
        if (data.files.length === 0) {
          content += '<div class="log-empty"><strong>暂无操作日志</strong>执行“整理撤回音频”或“处理撤回文档”后，记录会按日期出现在这里。</div></div>';
          showModal('操作日志', content, { wide: true });
          return;
        }
        const todayKey = new Date().toLocaleDateString('sv-SE');
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        content += `<section class="log-body">
          <nav class="log-dates" aria-label="日志日期">
            ${data.files.map((file, index) => {
              const label = file.replace('.log', '');
              const date = new Date(`${label}T00:00:00`);
              const weekday = Number.isNaN(date.getTime()) ? '' : weekdays[date.getDay()];
              return `<button type="button" class="log-date-item${index === 0 ? ' active' : ''}" onclick="viewLogFile(${inlineJsString(file)}, this)"><span>${escapeHtml(label)}<small> ${weekday}</small></span>${label === todayKey ? '<span class="log-today">今天</span>' : ''}</button>`;
            }).join('')}
          </nav>
          <div class="log-main">
            <div class="log-toolbar">
              <div class="log-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="operationLogSearchInput" placeholder="搜索文件名或操作..." oninput="searchLog(this.value, 'logContent', 'operationLogSearchCount')" onkeydown="if(event.key==='Enter'){event.preventDefault();logSearchNav(event.shiftKey?-1:1)}">
              </div>
              <span class="log-search-count" id="operationLogSearchCount"></span>
              <button class="icon-btn" type="button" onclick="logSearchNav(-1)" title="上一个" aria-label="上一个匹配"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg></button>
              <button class="icon-btn" type="button" onclick="logSearchNav(1)" title="下一个" aria-label="下一个匹配"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
            </div>
            <div class="log-filters" id="logFilters" role="group" aria-label="按操作类型筛选">
              ${LOG_FILTERS.map(filter => `<button type="button" class="log-filter${filter.key === 'all' ? ' active' : ''}" data-filter="${filter.key}" onclick="setLogFilter('${filter.key}')">${filter.label}<em data-count="${filter.key}"></em></button>`).join('')}
            </div>
            <div class="log-content" id="logContent">加载中...</div>
          </div>
        </section></div>`;
        logActiveFilter = 'all';
        showModal('操作日志', content, { wide: true });
        viewLogFile(data.files[0]);
      } catch (e) {
        showToast('请求失败: ' + e.message, 'error');
      }
    }

    const LOG_TASK_TYPES = {
      'move-audio': { label: '音频整理', seal: '移', color: '#2563a8', action: '撤回整理' },
      'remove-content': { label: '文档修改', seal: '删', color: '#6b4c8a', action: '恢复文档' },
      'before-restore': { label: '恢复前版本', seal: '存', color: '#8b7355', action: '恢复此版本' }
    };

    const LOG_FILTERS = [
      { key: 'all', label: '全部' },
      { key: 'move', label: '移动音频' },
      { key: 'delete', label: '删除段落' },
      { key: 'restore', label: '撤回/恢复' },
      { key: 'issue', label: '跳过/失败' }
    ];

    const LOG_STYLES = {
      '移动撤回音频':          { color: '#2563a8', soft: 'rgba(37,99,168,0.1)', seal: '移', kind: 'move' },
      '移动撤回音频-跳过':     { color: '#9a7209', soft: 'rgba(154,114,9,0.12)', seal: '跳', kind: 'move', issue: true },
      '移动撤回音频-失败':     { color: '#c0392b', soft: 'rgba(192,57,43,0.1)', seal: '败', kind: 'move', issue: true },
      '撤回音频整理':          { color: '#27713a', soft: 'rgba(39,113,58,0.1)', seal: '撤', kind: 'restore' },
      '删除返场故事内容':      { color: '#6b4c8a', soft: 'rgba(107,76,138,0.1)', seal: '删', kind: 'delete' },
      '删除返场故事内容-跳过': { color: '#9a7209', soft: 'rgba(154,114,9,0.12)', seal: '跳', kind: 'delete', issue: true },
      '删除返场故事内容-失败': { color: '#c0392b', soft: 'rgba(192,57,43,0.1)', seal: '败', kind: 'delete', issue: true },
      '恢复文档备份':          { color: '#27713a', soft: 'rgba(39,113,58,0.1)', seal: '恢', kind: 'restore' },
    };
    const LOG_DEFAULT_STYLE = { color: '#8b7355', soft: 'rgba(139,115,85,0.12)', seal: '记', kind: 'other' };
    let logActiveFilter = 'all';

    function setLogFilter(filter) {
      logActiveFilter = filter;
      document.querySelectorAll('#logFilters .log-filter').forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
      const timeline = document.querySelector('#logContent .log-timeline');
      if (!timeline) return;
      timeline.dataset.filter = filter;
      const visible = [...timeline.querySelectorAll('.log-entry')].some(entry => entry.offsetParent !== null);
      timeline.querySelector('.log-filter-empty').hidden = visible;
      const keyword = document.getElementById('operationLogSearchInput')?.value || '';
      if (keyword.trim()) searchLog(keyword, 'logContent', 'operationLogSearchCount');
    }

    function updateLogFilterCounts() {
      const timeline = document.querySelector('#logContent .log-timeline');
      const entries = timeline ? [...timeline.querySelectorAll('.log-entry')] : [];
      const counts = {
        all: entries.length,
        move: entries.filter(entry => entry.dataset.kind === 'move').length,
        delete: entries.filter(entry => entry.dataset.kind === 'delete').length,
        restore: entries.filter(entry => entry.dataset.kind === 'restore').length,
        issue: entries.filter(entry => entry.hasAttribute('data-issue')).length
      };
      document.querySelectorAll('#logFilters [data-count]').forEach(el => { el.textContent = counts[el.dataset.count] ?? 0; });
    }

    function formatLogContent(raw) {
      const lines = raw.split('\n');
      const entries = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const m = line.match(/^\[(\d{2}:\d{2}:\d{2})\]\s*\[([^\]]+)\]\s*([\s\S]*)$/);
        if (m) {
          entries.push({ time: m[1], action: m[2], details: [m[3]] });
        } else if (entries.length > 0) {
          entries[entries.length - 1].details.push(line);
        } else {
          entries.push({ time: '', action: '', details: [line] });
        }
      }
      const renderFile = (line, color) => {
        const trimmed = line.replace(/^\s+/, '');
        if (!trimmed.includes('→')) return `<div class="log-file">${escapeHtml(trimmed)}</div>`;
        const parts = trimmed.split('→');
        return `<div class="log-file"><span>${escapeHtml(parts[0].trim())} <span class="log-file-arrow" style="color:${color}">→</span> ${escapeHtml(parts.slice(1).join('→').trim())}</span></div>`;
      };
      const html = entries.slice().reverse().map(e => {
        if (!e.time) return `<div class="log-plain">${escapeHtml(e.details.join('\n'))}</div>`;
        const s = LOG_STYLES[e.action] || LOG_DEFAULT_STYLE;
        const files = e.details.slice(1).filter(d => d.trim());
        const fileHtml = files.map(line => renderFile(line, s.color)).join('');
        const fileBlock = files.length === 0 ? ''
          : files.length <= 4 ? `<div class="log-file-list">${fileHtml}</div>`
          : `<details class="log-files"><summary>查看 ${files.length} 条明细</summary><div class="log-file-list">${fileHtml}</div></details>`;
        return `<div class="log-entry" data-kind="${s.kind}"${s.issue ? ' data-issue' : ''} style="--log-color:${s.color};--log-soft:${s.soft}">
          <span class="log-entry-time">${escapeHtml(e.time)}</span>
          <div class="log-entry-card">
            <div class="log-entry-head"><span class="log-entry-tag"><i aria-hidden="true">${s.seal}</i>${escapeHtml(e.action)}</span></div>
            ${e.details[0] && e.details[0].trim() ? `<div class="log-entry-summary">${escapeHtml(e.details[0])}</div>` : ''}
            ${fileBlock}
          </div>
        </div>`;
      }).join('');
      return `<div class="log-timeline" data-filter="all">${html}<p class="log-filter-empty log-empty" hidden><strong>没有符合条件的记录</strong>换一个类型或日期试试。</p></div>`;
    }

    let logLoadId = 0;

    async function viewLogFile(filename, el) {
      const loadId = ++logLoadId;
      if (el) {
        el.parentElement.querySelectorAll('.log-date-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
      }
      const logDiv = document.getElementById('logContent');
      if (!logDiv) return;
      _logSearchMatches = [];
      _logSearchIdx = -1;
      _logSearchCountEl = document.getElementById('operationLogSearchCount');
      if (_logSearchCountEl) _logSearchCountEl.textContent = '';
      logDiv.innerHTML = '<div class="log-empty"><div class="loading"></div></div>';
      try {
        const root = currentRoot || document.getElementById('rootPath').value.trim();
        const resp = await fetch(`/api/logs/${encodeURIComponent(filename)}?root=${encodeURIComponent(root)}`);
        const data = await resp.json();
        if (loadId !== logLoadId) return;
        if (data.success) {
          if (!data.content) { logDiv.innerHTML = '<div class="log-empty"><strong>当天没有记录</strong>这份日志文件是空的。</div>'; updateLogFilterCounts(); return; }
          const truncatedNotice = data.truncated
            ? `<div class="result-item info" style="margin-bottom:10px;"><div class="result-file">日志较大，仅显示最近 ${formatFileSize(data.loadedSize || data.limit)}</div><div class="result-detail">最多显示最近 ${data.lineLimit || 10000} 行；日志总大小 ${formatFileSize(data.totalSize)}，较早内容仍保留在原日志文件中。</div></div>`
            : '';
          logDiv.innerHTML = truncatedNotice + formatLogContent(data.content);
          logDiv.scrollTop = 0;
          updateLogFilterCounts();
          setLogFilter(logActiveFilter);
        } else {
          logDiv.innerHTML = '<span style="color:var(--danger);">读取失败: ' + escapeHtml(data.error) + '</span>';
        }
      } catch (e) {
        if (loadId !== logLoadId) return;
        logDiv.innerHTML = '<span style="color:var(--danger);">请求失败: ' + escapeHtml(e.message) + '</span>';
      }
    }

    // ===== 日志搜索 =====
    let _logSearchMatches = [];
    let _logSearchIdx = -1;
    let _logSearchCountEl = null;

    function searchLog(keyword, containerId, countId) {
      const container = containerId ? document.getElementById(containerId) : null;
      const countEl = countId ? document.getElementById(countId) : null;
      if (!container) return;
      _logSearchCountEl = countEl;
      // Clear previous highlights
      container.querySelectorAll('.log-highlight').forEach(el => {
        el.replaceWith(document.createTextNode(el.textContent || ''));
      });
      container.normalize();
      _logSearchMatches = [];
      _logSearchIdx = -1;
      if (countEl) countEl.textContent = '';
      if (!keyword || !keyword.trim()) return;
      // Walk text nodes and highlight
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      const kw = keyword.toLowerCase();
      nodes.forEach(node => {
        const text = node.textContent;
        const lower = text.toLowerCase();
        if (!lower.includes(kw)) return;
        const frag = document.createDocumentFragment();
        let lastIdx = 0;
        let idx = lower.indexOf(kw, 0);
        while (idx !== -1) {
          if (idx > lastIdx) frag.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
          const mark = document.createElement('span');
          mark.className = 'log-highlight';
          mark.style.cssText = 'background:#fbbf24;color:#111;border-radius:2px;padding:0 1px;';
          mark.textContent = text.substring(idx, idx + keyword.length);
          frag.appendChild(mark);
          lastIdx = idx + keyword.length;
          idx = lower.indexOf(kw, lastIdx);
        }
        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.substring(lastIdx)));
        node.parentNode.replaceChild(frag, node);
      });
      container.querySelectorAll('.log-highlight').forEach(mark => mark.closest('details')?.setAttribute('open', ''));
      _logSearchMatches = Array.from(container.querySelectorAll('.log-highlight')).filter(mark => mark.offsetParent !== null);
      if (countEl) countEl.textContent = _logSearchMatches.length > 0 ? `共 ${_logSearchMatches.length} 次出现 | 1 / ${_logSearchMatches.length}` : '无匹配';
      if (_logSearchMatches.length > 0) { _logSearchIdx = 0; scrollToLogMatch(0); }
    }

    function logSearchNav(dir) {
      if (_logSearchMatches.length === 0) return;
      _logSearchIdx = (_logSearchIdx + dir + _logSearchMatches.length) % _logSearchMatches.length;
      scrollToLogMatch(_logSearchIdx);
    }

    function scrollToLogMatch(idx) {
      if (!_logSearchMatches[idx] || !_logSearchMatches[idx].isConnected) return;
      _logSearchMatches.forEach((el, i) => {
        el.style.background = i === idx ? '#f97316' : '#fbbf24';
        el.style.fontWeight = i === idx ? '700' : '';
      });
      _logSearchMatches[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (_logSearchCountEl && _logSearchCountEl.isConnected) {
        _logSearchCountEl.textContent = `共 ${_logSearchMatches.length} 次出现 | ${idx + 1} / ${_logSearchMatches.length}`;
      }
    }

    // ===== Resize Handle =====
    (function() {
      const handle = document.getElementById('resizeHandle');
      const sidebar = document.querySelector('.sidebar');
      const widthKey = 'fileManager_sidebarWidth';
      let isResizing = false;
      const savedWidth = Number(localStorage.getItem(widthKey));
      if (savedWidth >= 200 && savedWidth <= 600) sidebar.style.width = savedWidth + 'px';
      handle.title = '拖动调整宽度，双击恢复默认';

      handle.addEventListener('mousedown', (e) => {
        isResizing = true;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      handle.addEventListener('dblclick', () => {
        sidebar.style.width = '';
        localStorage.removeItem(widthKey);
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = Math.max(200, Math.min(600, e.clientX));
        sidebar.style.width = newWidth + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (!isResizing) return;
        isResizing = false;
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        localStorage.setItem(widthKey, String(parseInt(sidebar.style.width, 10) || ''));
      });
    })();

    // ===== Scroll Float Buttons =====
    (function() {
      const area = document.getElementById('previewArea');
      const topBtn = document.getElementById('scrollFloatTop');
      const bottomBtn = document.getElementById('scrollFloatBottom');

      area.addEventListener('scroll', () => {
        const st = area.scrollTop;
        const sh = area.scrollHeight;
        const ch = area.clientHeight;
        const canScroll = sh > ch + 50;

        topBtn.classList.toggle('visible', canScroll && st > 150);
        bottomBtn.classList.toggle('visible', canScroll && (sh - st - ch) > 150);
      });
    })();

    // ===== Keyboard Shortcuts =====
    document.addEventListener('keydown', (e) => {
      // Esc: close motto overlay / modal / confirm dialog
      if (e.key === 'Escape') {
        const mottoOverlay = document.getElementById('mottoOverlay');
        if (mottoOverlay && mottoOverlay.classList.contains('show')) {
          closeMottoOverlay();
          return;
        }
        const confirmOverlay = document.getElementById('confirmOverlay');
        if (confirmOverlay && confirmOverlay.classList.contains('show')) {
          document.getElementById('confirmCancel').click();
          return;
        }
        const modalOverlay = document.getElementById('modalOverlay');
        if (modalOverlay && modalOverlay.classList.contains('show')) {
          closeModal();
          return;
        }
      }
      // Ctrl+K or /: focus tree filter
      const typing = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
      const overlayOpen = document.querySelector('.modal-overlay.show, .motto-overlay.show');
      if (!overlayOpen && (((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') || (e.key === '/' && !typing))) {
        e.preventDefault();
        const filterInput = document.getElementById('treeFilterInput');
        filterInput.focus();
        filterInput.select();
        return;
      }
      // Ctrl+F: focus Word search input if Word preview is visible
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        const wordSearch = document.getElementById('wordSearchInput');
        if (wordSearch && wordSearch.offsetParent !== null) {
          e.preventDefault();
          wordSearch.focus();
          wordSearch.select();
        }
      }
    });

    // ===== Shared Motto Plaque =====
    const MOTTO_WORDS = ['人心', '格局', '知行', '担当', '远见', '定力', '取舍', '敬畏'];
    const MOTTO_SPARK_COLORS = ['#f1d79e', '#d4a017', '#e6a34a', '#c95a3e', '#f7ead0'];
    let mottoReturnFocus = null;
    let mottoEffectGeneration = 0;

    function createMottoPlaque(variant = 'default') {
      const plaque = document.createElement('button');
      plaque.type = 'button';
      plaque.className = `motto-plaque${variant === 'compact' ? ' compact' : ''}`;
      plaque.title = '知行合一';
      plaque.setAttribute('aria-label', '知行合一，点击显示主题词');

      for (const cornerName of ['top-left', 'top-right', 'bottom-left', 'bottom-right']) {
        const corner = document.createElement('span');
        corner.className = `motto-plaque-corner ${cornerName}`;
        corner.setAttribute('aria-hidden', 'true');
        plaque.appendChild(corner);
      }
      for (const crestPosition of ['top', 'bottom']) {
        const crest = document.createElement('span');
        crest.className = `motto-plaque-crest ${crestPosition}`;
        crest.setAttribute('aria-hidden', 'true');
        plaque.appendChild(crest);
      }

      const text = document.createElement('span');
      text.className = 'motto-plaque-text';
      for (const character of '知行合一') {
        const characterElement = document.createElement('span');
        characterElement.className = 'motto-plaque-character';
        characterElement.textContent = character;
        text.appendChild(characterElement);
      }
      plaque.appendChild(text);
      plaque.addEventListener('click', (event) => {
        event.stopPropagation();
        launchMottoEffect(plaque);
      });
      return plaque;
    }

    function mountMottoPlaques() {
      const welcomeMount = document.getElementById('welcomeMottoMount');
      const overlayMount = document.getElementById('overlayMottoMount');
      if (welcomeMount) welcomeMount.replaceChildren(createMottoPlaque('compact'));
      if (overlayMount) overlayMount.replaceChildren(createMottoPlaque());
    }

    function emitMottoSparks(originX, originY, options = {}) {
      const {
        count = 10,
        minDistance = 14,
        maxDistance = 46,
        delay = 0,
        generation = mottoEffectGeneration,
        reducedMotion = false
      } = options;
      if (reducedMotion) return;

      const createBurst = () => {
        if (generation !== mottoEffectGeneration) return;
        for (let i = 0; i < count; i++) {
          const spark = document.createElement('span');
          const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.58;
          const distance = minDistance + Math.random() * Math.max(0, maxDistance - minDistance);
          const size = 2 + Math.random() * 3;
          const color = MOTTO_SPARK_COLORS[Math.floor(Math.random() * MOTTO_SPARK_COLORS.length)];
          spark.className = 'motto-spark';
          spark.style.left = `${originX}px`;
          spark.style.top = `${originY}px`;
          spark.style.width = `${size}px`;
          spark.style.height = `${size * 3.2}px`;
          spark.style.animationDuration = `${0.62 + Math.random() * 0.34}s`;
          spark.style.setProperty('--spark-angle', `${angle * 180 / Math.PI + 90}deg`);
          spark.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
          spark.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
          spark.style.background = color;
          spark.style.boxShadow = `0 0 5px ${color}, 0 0 11px ${color}`;
          document.body.appendChild(spark);
          setTimeout(() => spark.remove(), 1050);
        }
      };

      if (delay > 0) setTimeout(createBurst, delay);
      else createBurst();
    }

    function emitMottoSparkTrail(originX, originY, targetX, targetY, options = {}) {
      const {
        delay = 0,
        duration = 760,
        generation = mottoEffectGeneration,
        reducedMotion = false
      } = options;
      if (reducedMotion) return;

      const steps = 5;
      for (let step = 1; step <= steps; step++) {
        const progress = step / steps;
        const easedProgress = 1 - Math.pow(1 - progress, 2.6);
        const isFinalBurst = step === steps;
        emitMottoSparks(
          originX + (targetX - originX) * easedProgress,
          originY + (targetY - originY) * easedProgress,
          {
            count: isFinalBurst ? 11 : 4,
            minDistance: isFinalBurst ? 18 : 7,
            maxDistance: isFinalBurst ? 56 : 27,
            delay: delay + Math.round(progress * duration),
            generation,
            reducedMotion
          }
        );
      }
    }

    function launchMottoEffect(plaque) {
      const rect = plaque.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const generation = ++mottoEffectGeneration;
      const onCanvas = plaque.classList.contains('compact');

      emitMottoSparks(cx, cy, {
        count: 36,
        minDistance: 66,
        maxDistance: 180,
        generation,
        reducedMotion
      });

      const wordPool = [...MOTTO_WORDS];
      for (let i = wordPool.length - 1; i > 0; i--) {
        const swapIndex = Math.floor(Math.random() * (i + 1));
        [wordPool[i], wordPool[swapIndex]] = [wordPool[swapIndex], wordPool[i]];
      }

      wordPool.slice(0, 4).forEach((word, index) => {
        const angle = -Math.PI * 0.9 + index * (Math.PI * 0.6) + (Math.random() - 0.5) * 0.28;
        const distance = reducedMotion ? 62 : 150 + Math.random() * 72;
        const targetX = Math.max(48, Math.min(window.innerWidth - 48, cx + Math.cos(angle) * distance));
        const targetY = Math.max(30, Math.min(window.innerHeight - 30, cy + Math.sin(angle) * distance));
        const delayMs = reducedMotion ? 0 : index * 100;
        const wordElement = document.createElement('span');
        wordElement.className = `motto-effect-word${onCanvas ? ' on-canvas' : ''}`;
        wordElement.textContent = word;
        wordElement.style.left = `${cx}px`;
        wordElement.style.top = `${cy}px`;
        wordElement.style.setProperty('--tx', `${targetX - cx}px`);
        wordElement.style.setProperty('--ty', `${targetY - cy}px`);
        wordElement.style.setProperty('--rotation', `${-8 + Math.random() * 16}deg`);
        wordElement.style.setProperty('--delay', `${delayMs / 1000}s`);
        document.body.appendChild(wordElement);
        setTimeout(() => wordElement.remove(), reducedMotion ? 1200 : 2850);

        emitMottoSparkTrail(cx, cy, targetX, targetY, {
          delay: delayMs + 220,
          duration: 1400,
          generation,
          reducedMotion
        });
      });
    }

    function openMottoOverlay() {
      const overlay = document.getElementById('mottoOverlay');
      if (!overlay) return;
      mottoReturnFocus = document.activeElement;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
      document.getElementById('brandMottoButton')?.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => overlay.querySelector('.motto-plaque')?.focus());
    }

    function closeMottoOverlay(event) {
      if (event && event.target.closest('.motto-plaque')) return;
      const overlay = document.getElementById('mottoOverlay');
      if (!overlay || !overlay.classList.contains('show')) return;
      overlay.classList.remove('show');
      mottoEffectGeneration++;
      overlay.setAttribute('aria-hidden', 'true');
      document.getElementById('brandMottoButton')?.setAttribute('aria-expanded', 'false');
      document.querySelectorAll('.motto-spark, .motto-effect-word').forEach((element) => element.remove());
      if (mottoReturnFocus && typeof mottoReturnFocus.focus === 'function') mottoReturnFocus.focus();
      mottoReturnFocus = null;
    }

    // ===== Init =====
    (function() {
      mountMottoPlaques();
      const savedRoot = localStorage.getItem('fileManager_root');
      if (savedRoot) document.getElementById('rootPath').value = savedRoot;
      loadTree({ fallbackOnInvalid: Boolean(savedRoot) });
    })();
  </script>
</body>

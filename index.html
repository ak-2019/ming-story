    .log-entry-tag i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--log-color);
      color: var(--seal-ink);
      font-family: var(--seal-font);
      font-size: 11px;
      font-style: normal;
    }

    .log-entry-summary { margin-top: 5px; color: var(--ink); font-size: 12.5px; line-height: 1.6; word-break: break-all; }
    .log-files { margin-top: 6px; }
    .log-files summary { color: var(--ink-subtle); font-size: 11.5px; cursor: pointer; }
    .log-files summary:hover { color: var(--primary); }
    .log-file-list { margin-top: 6px; padding: 3px 10px; border-radius: 4px; background: rgba(44,24,16,0.035); }

    .log-file {
      padding: 3px 0;
      border-top: 1px dashed var(--hairline);
      color: var(--ink-muted);
      font-size: 11.5px;
      line-height: 1.6;
      word-break: break-all;
    }

    .log-file:first-child { border-top: 0; }
    .log-file-arrow { font-weight: 700; }
    .log-plain { padding: 4px 8px; color: var(--ink-muted); font-size: 12px; }

    .log-empty {
      padding: 36px 16px;
      color: var(--ink-subtle);
      font-size: 12.5px;
      line-height: 1.8;
      text-align: center;
    }

    .log-empty strong { display: block; color: var(--ink-muted); font-family: 'SimSun', serif; font-size: 16px; }

    .log-timeline[data-filter="move"] .log-entry:not([data-kind="move"]),
    .log-timeline[data-filter="delete"] .log-entry:not([data-kind="delete"]),
    .log-timeline[data-filter="restore"] .log-entry:not([data-kind="restore"]),
    .log-timeline[data-filter="issue"] .log-entry:not([data-issue]) { display: none; }

    @media (max-width: 760px) {
      .log-body { grid-template-columns: 1fr; height: auto; }
      .log-dates { flex-direction: row; padding: 0 0 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hairline); }

      .log-content { max-height: 55vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast, .toast.leaving, .modal-overlay.show, .modal-overlay.show .modal,
      .preview-area > *, .tree-children.open > .tree-item, .task-progress-bar span,
      .btn.is-busy > svg:first-child { animation: none !important; }
      .btn, .tree-label, .brand-seal, .icon-btn { transition: none; }
    }
  </style>

  <div class="header">

      </button>

  <script>
    // ===== 检测是否通过 file:// 协议直接打开 =====
    if (location.protocol === 'file:') {
      document.getElementById('guideOverlay').style.display = 'block';
      document.getElementById('guideStatus').style.display = 'none';
      document.getElementById('guideActions').style.display = 'block';
      throw new Error('stop');
    }

    let currentRoot = '';
    let totalFiles = 0;
    let activeLabel = null;
    let audioCandidates = [];
    let documentCandidates = [];
    let activeScan = null;
    let activePreviewController = null;
    let activeRootSettingsController = null;
    let previewRequestId = 0;
    let treeLoadId = 0;
    let rootContextId = 0;
    let rootSettingsRequestId = 0;
    let dashboardRequestId = 0;
    let activeDashboardScan = null;
    let dashboardData = null;
    let dashboardActiveModule = 'normal';
    let currentContentView = 'placeholder';
    let currentPreviewPath = '';
    let wordScrollListeners = [];

    function clearWordPreviewListeners() {
      wordScrollListeners.forEach(({ element, handler }) => element.removeEventListener('scroll', handler));
      wordScrollListeners = [];
    }

    function stopAudioPreview() {
      const player = document.getElementById('audioPlayer');
      if (!player) return;
      player.pause();
      player.removeAttribute('src');
      player.load();
    }

    function addWordScrollListener(element, handler) {
      element.addEventListener('scroll', handler);
      wordScrollListeners.push({ element, handler });
    }

    // ===== Tooltip =====
    (function() {
      const bubble = document.getElementById('tipBubble');
      document.addEventListener('mouseover', (e) => {
        if (!e.target || !e.target.closest) return;
        const tip = e.target.closest('.btn-tip');
        if (!tip) return;
        const text = tip.getAttribute('data-tip');
        if (!text) return;
        bubble.textContent = text;
        bubble.className = 'tip-bubble';
        const rect = tip.getBoundingClientRect();
        bubble.style.visibility = 'hidden';
        bubble.style.display = 'block';
        const bw = bubble.offsetWidth;
        const bh = bubble.offsetHeight;
        bubble.style.visibility = '';
        let left = rect.left + rect.width / 2 - bw / 2;
        if (left < 4) left = 4;
        if (left + bw > window.innerWidth - 4) left = window.innerWidth - 4 - bw;
        if (rect.top - bh - 10 > 0) {
          bubble.style.top = (rect.top - bh - 8) + 'px';
          bubble.classList.add('tip-up');
        } else {
          bubble.style.top = (rect.bottom + 8) + 'px';
          bubble.classList.add('tip-down');
        }
        bubble.style.left = left + 'px';
        bubble.classList.add('show');
      });
      document.addEventListener('mouseout', (e) => {
        if (!e.target || !e.target.closest) return;
        const tip = e.target.closest('.btn-tip');
        if (!tip) return;
        if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.btn-tip') === tip) return;
        bubble.classList.remove('show');
      });
    })();

    // ===== Toast =====
    const TOAST_SEALS = { success: '成', error: '误', info: '讯' };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      while (container.children.length >= 4) container.firstElementChild.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
      toast.title = '点击关闭';
      const seal = document.createElement('span');
      seal.className = 'toast-seal';
      seal.setAttribute('aria-hidden', 'true');
      seal.textContent = TOAST_SEALS[type] || TOAST_SEALS.info;
      const text = document.createElement('span');
      text.className = 'toast-text';
      text.textContent = message;
      toast.append(seal, text);
      container.appendChild(toast);
      let timer = null;
      const dismiss = () => {
        clearTimeout(timer);
        if (toast.classList.contains('leaving')) return;
        toast.classList.add('leaving');
        setTimeout(() => toast.remove(), 260);
      };
      const arm = () => { timer = setTimeout(dismiss, type === 'error' ? 5000 : 3000); };
      toast.addEventListener('click', dismiss);
      toast.addEventListener('mouseenter', () => clearTimeout(timer));
      toast.addEventListener('mouseleave', arm);
      arm();
    }

    function copyText(text, successMessage = '已复制') {
      const done = () => showToast(successMessage, 'success');
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(done, () => showToast('复制失败，请手动选择文字复制', 'error'));
      }
      const area = document.createElement('textarea');
      area.value = text;
      area.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      if (ok) done();
      else showToast('复制失败，请手动选择文字复制', 'error');
      return Promise.resolve();
    }

    function copyIssueDetails(button) {
      const rows = button.closest('.issue-details')?.querySelectorAll('.issue-row') || [];
      const text = [...rows].map(row => row.innerText.replace(/\s*\n\s*/g, ' — ')).join('\n');
      copyText(text, `已复制 ${rows.length} 条异常信息`);
    }

    function showRootSettings() {
      const saved = document.getElementById('rootPath').value.trim();
      showModal('目录设置', `
        <p style="margin-bottom:10px;">留空将使用程序所在文件夹的上级目录。</p>
        <input id="rootSettingsInput" type="text" value="${escapeHtml(saved).replace(/"/g, '&quot;')}" placeholder="输入 Windows 文件夹路径"
          style="width:100%;padding:9px 10px;border:1px solid var(--hairline-strong);border-radius:4px;background:var(--canvas);color:var(--ink);font-size:13px;outline:none;">
        <div id="rootSettingsError" style="display:none;margin-top:8px;color:var(--danger);font-size:12px;line-height:1.6;"></div>
        <div style="display:flex;justify-content:flex-end;margin-top:12px;">
          <button class="btn btn-primary" id="rootSettingsApply" onclick="applyRootSettings()">应用目录</button>
        </div>
      `);
      setTimeout(() => document.getElementById('rootSettingsInput')?.focus(), 0);
    }

    async function applyRootSettings() {
      const input = document.getElementById('rootSettingsInput');
      const nextRoot = input ? input.value.trim() : '';
      const errorEl = document.getElementById('rootSettingsError');
      const applyButton = document.getElementById('rootSettingsApply');
      const loadId = ++rootSettingsRequestId;
      if (activeRootSettingsController) activeRootSettingsController.abort();
      const controller = new AbortController();
      activeRootSettingsController = controller;
      if (errorEl) {
        errorEl.style.display = 'none';
        errorEl.textContent = '';
      }
      if (applyButton) {
        applyButton.disabled = true;
        applyButton.textContent = '正在检查...';
      }

      try {
        const url = nextRoot ? `/api/tree?root=${encodeURIComponent(nextRoot)}` : '/api/tree';
        const resp = await fetch(url, { signal: controller.signal });
        const data = await resp.json();
        if (loadId !== rootSettingsRequestId) return;
        if (!data.success) throw new Error(data.error || '目录不可用');
        treeLoadId++;
        document.getElementById('rootPath').value = nextRoot;
        applyLoadedTree(data);
        if (activeRootSettingsController === controller) activeRootSettingsController = null;
        closeModal();
        showToast(`已加载目录: ${data.root}`, 'success');
      } catch (e) {
        if (loadId !== rootSettingsRequestId) return;
        if (e.name === 'AbortError') return;
        if (errorEl) {
          errorEl.textContent = `无法使用该目录：${e.message}`;
          errorEl.style.display = 'block';
        }
      } finally {
        if (activeRootSettingsController === controller) activeRootSettingsController = null;
        if (loadId === rootSettingsRequestId && applyButton) {
          applyButton.disabled = false;
          applyButton.textContent = '应用目录';
        }
      }
    }

    // ===== Guide =====
    function showGuide() {
      const content = `
        <div style="line-height:1.8;font-size:13px;color:var(--ink);">
          <h3 style="font-family:'SimSun',serif;font-size:16px;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--hairline);color:var(--primary);">一、系统介绍</h3>
          <p style="margin:0 0 12px;color:var(--ink-muted);">
            本系统是一个本地文件管理工具，用于浏览、预览和批量处理"大明帝国"项目中的文件。<br>
            主要针对<strong>返场故事撤回</strong>相关的文件操作场景，提供一站式的查找、移动、删除和备份功能。<br>
            系统基于 Node.js 运行在本地，所有操作均在本机完成，不涉及网络传输。
          </p>

          <h3 style="font-family:'SimSun',serif;font-size:16px;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--hairline);color:var(--primary);">二、使用方法</h3>
          <p style="margin:0 0 4px;color:var(--ink-muted);">
            <strong>1. 启动</strong> — 双击 <code>启动文件管理系统.vbs</code>，浏览器自动打开。开发环境也可以使用 <code>start.bat</code>。<br>
            <strong>2. 选择目录</strong> — 默认管理程序所在文件夹的上级目录；需要切换范围时，从右上角目录设置修改。系统会自动记忆上次的目录。<br>
            <strong>3. 浏览文件</strong> — 左侧目录树点击文件夹展开，点击文件在右侧预览。<br>
            <strong>4. 查看统计</strong> — 点击右上角“统计”，查看当前目录的模块、剧集和音频构成。<br>
            <strong>5. 执行操作</strong> — 批量操作会先扫描并显示文件清单，确认后才会执行。<br>
            <strong>6. 查看日志</strong> — 每次操作自动记录日志，可通过右上角日志按钮查看。
          </p>

          <h3 style="font-family:'SimSun',serif;font-size:16px;margin:16px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--hairline);color:var(--primary);">三、功能详细说明</h3>

          <div style="margin-bottom:10px;padding:10px 12px;background:var(--surface-1);border-radius:4px;border-left:3px solid #2563eb;">
            <strong style="color:#2563eb;">整理撤回音频</strong><br>
            <span style="color:var(--ink-muted);">
              扫描当前目录下所有文件，将文件名包含"撤回"的音频文件自动移动到"撤回文件夹"中。<br>
              重名文件会自动添加编号后缀。操作完成后目录树自动刷新。
            </span>
          </div>

          <div style="margin-bottom:10px;padding:10px 12px;background:var(--surface-1);border-radius:4px;border-left:3px solid #d4a017;">
            <strong style="color:#d4a017;">处理撤回文档</strong><br>
            <span style="color:var(--ink-muted);">
              扫描所有 Word 文档（.docx），查找内容中同时包含"返场故事"和"撤回"关键词的段落。<br>
              用户可以先勾选文件，再删除命中段落及其后的全部内容，原文件会自动备份。
            </span>
          </div>

          <div style="margin-bottom:10px;padding:10px 12px;background:var(--surface-1);border-radius:4px;border-left:3px solid #7c3aed;">

    // ===== Modal =====
    function showModal(title, content, { wide = false } = {}) {
      document.getElementById('modal').classList.toggle('modal-wide', wide);
      document.getElementById('modalTitle').innerHTML = title;
      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('modalOverlay')) {
        if (activeScan) cancelActiveScan(false);
        if (activeRootSettingsController) {
          rootSettingsRequestId++;
          activeRootSettingsController.abort();
          activeRootSettingsController = null;
        }
        document.getElementById('modalOverlay').classList.remove('show');
      }
    }

    function renderConfirmExtra({ items, points, acknowledge, itemLabel, type }) {
      const limit = 200;
      let html = '';
      if (points.length) html += `<ul class="confirm-points">${points.map(point => `<li>${escapeHtml(point)}</li>`).join('')}</ul>`;
      if (items.length) {
        html += `<div class="confirm-files"><div class="confirm-files-head"><span>将处理的${escapeHtml(itemLabel)}</span><span>${items.length} 个</span></div><ol>${items.slice(0, limit).map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ol>${items.length > limit ? `<div class="confirm-files-more">还有 ${items.length - limit} 个未列出</div>` : ''}</div>`;
      }
      if (acknowledge) html += `<label class="confirm-ack ${type === 'danger' ? '' : 'warning'}"><input type="checkbox" id="confirmAck"><span>${escapeHtml(acknowledge)}</span></label>`;
      return html;
    }

    function showConfirm({ title, message, type, okText, items = [], points = [], acknowledge = '', itemLabel = '文件' }) {
      return new Promise(resolve => {
        const colors = {
          danger:  { icon: '慎', iconBg: 'var(--danger)', btnBg: 'var(--danger)', btnColor: '#fff' },
          warning: { icon: '慎', iconBg: '#b8860b', btnBg: '#b8860b', btnColor: '#fff' },
          info:    { icon: '询', iconBg: 'var(--primary)', btnBg: 'var(--primary)', btnColor: 'var(--on-primary)' },
        };
        const c = colors[type] || colors.info;
        const overlay = document.getElementById('confirmOverlay');
        const iconEl = document.getElementById('confirmIcon');
        const titleEl = document.getElementById('confirmTitle');
        const msgEl = document.getElementById('confirmMessage');
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');

        iconEl.textContent = c.icon;
        iconEl.style.background = c.iconBg;
        titleEl.textContent = title || '确认操作';
        msgEl.textContent = message || '';
        okBtn.textContent = okText || '确认';
        okBtn.style.background = c.btnBg;
        okBtn.style.color = c.btnColor;
        okBtn.style.border = 'none';
        const extraEl = document.getElementById('confirmExtra');
        const hasExtra = items.length > 0 || points.length > 0 || Boolean(acknowledge);
        overlay.querySelector('.modal').style.maxWidth = hasExtra ? '580px' : '440px';
        extraEl.innerHTML = renderConfirmExtra({ items, points, acknowledge, itemLabel, type });
        const ackInput = document.getElementById('confirmAck');
        okBtn.disabled = Boolean(ackInput);
        const onAck = () => { okBtn.disabled = !ackInput.checked; };
        if (ackInput) ackInput.addEventListener('change', onAck);

        overlay.classList.add('show');
        requestAnimationFrame(() => cancelBtn.focus());

        function cleanup() {
          overlay.classList.remove('show');
          okBtn.disabled = false;
          if (ackInput) ackInput.removeEventListener('change', onAck);
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          overlay.removeEventListener('click', onOverlay);
        }
        function onOk() { cleanup(); resolve(true); }
        function onCancel() { cleanup(); resolve(false); }
        function onOverlay(e) { if (e.target === overlay) { cleanup(); resolve(false); } }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        overlay.addEventListener('click', onOverlay);
      });
    }

    // ===== Tree =====

        '.png': '<svg viewBox="0 0 24 24" fill="none" stroke="var(--image-badge)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',

    const folderIcon = '<svg viewBox="0 0 24 24" fill="var(--folder-icon)" stroke="var(--folder-open)" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>';
    const folderOpenIcon = '<svg viewBox="0 0 24 24" fill="var(--folder-open)" stroke="var(--folder-icon)" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>';

    const SPECIAL_FOLDERS = {
      '撤回文件夹': {
        color: '#2563eb',
        icon: '<svg viewBox="0 0 24 24" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
        openIcon: '<svg viewBox="0 0 24 24" fill="#1d4ed8" stroke="#2563eb" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
        badge: '撤回'
      },
      '备份文件夹': {
        color: '#7c3aed',
        icon: '<svg viewBox="0 0 24 24" fill="#7c3aed" stroke="#6d28d9" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
        openIcon: '<svg viewBox="0 0 24 24" fill="#6d28d9" stroke="#7c3aed" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
        badge: '备份'
      },
      '操作日志': {
        color: '#27713a',
        icon: '<svg viewBox="0 0 24 24" fill="#27713a" stroke="#1e5c2e" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
        openIcon: '<svg viewBox="0 0 24 24" fill="#1e5c2e" stroke="#27713a" stroke-width="0.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>',
        badge: '日志'
      }

    function updateLoadedFileCount() {
      document.getElementById('fileCount').textContent = `已加载 ${totalFiles} 册`;
    }

    function renderTree(node, depth = 0) {
      const item = document.createElement('div');
      item.className = 'tree-item';

      const label = document.createElement('div');
      label.className = 'tree-label';
      label.style.paddingLeft = (12 + depth * 16) + 'px';
      label.tabIndex = depth === 0 ? 0 : -1;
      label.setAttribute('role', 'treeitem');
      label.dataset.type = node.type;
      label.title = node.name;

      if (node.type === 'directory') {
        const toggle = document.createElement('span');
        toggle.className = 'tree-toggle';
        toggle.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M8 5l8 7-8 7z"/></svg>';

        const special = SPECIAL_FOLDERS[node.name];
        const fIcon = special ? special.icon : folderIcon;
        const fOpenIcon = special ? special.openIcon : folderOpenIcon;

        const icon = document.createElement('span');
        icon.className = 'tree-icon';
        icon.innerHTML = fIcon;

        const name = document.createElement('span');
        name.className = 'tree-name';
        name.textContent = node.name;
        name.dataset.name = node.name;
        if (special) name.style.color = special.color;

        label.appendChild(toggle);
        label.appendChild(icon);
        label.appendChild(name);

        if (special) {
          const badge = document.createElement('span');
          badge.style.cssText = `font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px;background:${special.color}18;color:${special.color};border:1px solid ${special.color}30;font-weight:500;`;
          badge.textContent = special.badge;
          label.appendChild(badge);
        }

        const children = document.createElement('div');
        children.className = 'tree-children';
        children.setAttribute('role', 'group');
        children.style.setProperty('--guide', `${26 + depth * 16}px`);
        node._loaded = Array.isArray(node.children);
        node._loading = false;
        node._pagination = node.pagination || null;
        let loadingMore = false;

        function removeStatusRows() {
          [...children.children].forEach(child => {
            if (child.classList.contains('tree-empty') || child.classList.contains('tree-loading') || child.classList.contains('tree-more')) {
              child.remove();
            }
          });
        }

        function appendChildNodes(items) {
          removeStatusRows();
          items.forEach(child => children.appendChild(renderTree(child, depth + 1)));
          if (treeFilterQuery) scheduleTreeFilter();
        }

        function renderPagination() {
          const existing = [...children.children].find(child => child.classList.contains('tree-more'));
          if (existing) existing.remove();
          if (!node._pagination || !node._pagination.hasMore) {
            if (node._loaded && node.children.length === 0) children.innerHTML = '<div class="tree-empty">空文件夹</div>';
            return;
          }

          const remaining = Math.max(0, Number(node._pagination.total || 0) - Number(node._pagination.nextOffset || 0));
          const moreButton = document.createElement('button');
          moreButton.type = 'button';
          moreButton.className = 'tree-more';
          moreButton.textContent = remaining > 0 ? `继续加载（剩余 ${remaining} 项）` : '继续加载';
          moreButton.addEventListener('click', async (event) => {
            event.stopPropagation();
            if (loadingMore) return;
            loadingMore = true;
            moreButton.disabled = true;
            moreButton.textContent = '正在加载...';
            const requestLoadId = treeLoadId;
            const requestRoot = currentRoot;
            try {
              const offset = Number(node._pagination.nextOffset || 0);
              const version = Number(node._pagination.directoryMtimeMs || 0);
              const url = `/api/tree?root=${encodeURIComponent(requestRoot)}&path=${encodeURIComponent(node.fullPath)}&offset=${offset}&version=${version}`;
              const resp = await fetch(url);
              const data = await resp.json();
              if (requestLoadId !== treeLoadId || requestRoot !== currentRoot || !item.isConnected) return;
              if (!data.success) {
                if (data.code === 'DIRECTORY_CHANGED') {
                  moreButton.textContent = '目录已变化，正在刷新...';
                  showToast('目录内容已变化，正在重新加载', 'info');
                  await loadTree();
                  return;
                }
                throw new Error(data.error);
              }
              const page = Array.isArray(data.data.children) ? data.data.children : [];
              node.children.push(...page);
              node._pagination = data.data.pagination || null;
              appendChildNodes(page);
              renderPagination();
              if (Array.isArray(data.skipped) && data.skipped.length > 0) {
                showToast(`有 ${data.skipped.length} 个项目无法读取`, 'info');
              }
            } catch (e) {
              if (requestLoadId === treeLoadId && requestRoot === currentRoot && item.isConnected) {
                moreButton.disabled = false;
                moreButton.textContent = '加载失败，点击重试';
                showToast(`继续加载失败：${e.message}`, 'error');
              }
            } finally {
              loadingMore = false;
            }
          });
          children.appendChild(moreButton);
        }

        if (node._loaded) {
          appendChildNodes(node.children);
          renderPagination();
        }

        function setOpen(isOpen) {
          children.classList.toggle('open', isOpen);
          toggle.classList.toggle('expanded', isOpen);
          icon.innerHTML = isOpen ? fOpenIcon : fIcon;
          label.setAttribute('aria-expanded', String(isOpen));
        }

        label.addEventListener('click', async () => {
          if (children.classList.contains('open')) {
            setOpen(false);
            return;
          }

          if (!node._loaded && !node._loading) {
            node._loading = true;
            children.innerHTML = '<div class="tree-loading">正在读取...</div>';
            setOpen(true);
            const requestLoadId = treeLoadId;
            const requestRoot = currentRoot;
            try {
              const url = `/api/tree?root=${encodeURIComponent(requestRoot)}&path=${encodeURIComponent(node.fullPath)}`;
              const resp = await fetch(url);
              const data = await resp.json();
              if (requestLoadId !== treeLoadId || requestRoot !== currentRoot || !item.isConnected) return;
              if (!data.success) throw new Error(data.error);
              node.children = Array.isArray(data.data.children) ? data.data.children : [];
              node._pagination = data.data.pagination || null;
              children.innerHTML = '';
              appendChildNodes(node.children);
              node._loaded = true;
              renderPagination();
              if (Array.isArray(data.skipped) && data.skipped.length > 0) {
                showToast(`有 ${data.skipped.length} 个项目无法读取`, 'info');
              }
            } catch (e) {
              if (requestLoadId === treeLoadId && requestRoot === currentRoot && item.isConnected) {
                children.innerHTML = `<div class="tree-empty" style="color:var(--danger);">读取失败：${escapeHtml(e.message)}</div>`;
              }
            } finally {
              node._loading = false;
            }
          }
          setOpen(true);
        });

        // 默认展开第一层
        if (depth === 0) {
          setOpen(true);
        }

        item.appendChild(label);
        item.appendChild(children);
      } else {
        const toggle = document.createElement('span');
        toggle.className = 'tree-toggle hidden';
        toggle.innerHTML = '&nbsp;';

        const icon = document.createElement('span');
        icon.className = 'tree-icon';
        icon.innerHTML = getFileIcon(node.ext);

        const name = document.createElement('span');
        name.className = 'tree-name';
        name.textContent = node.name;
        name.dataset.name = node.name;

        label.appendChild(toggle);
        label.appendChild(icon);
        label.appendChild(name);

        label.addEventListener('click', () => {
          if (activeLabel) {
            activeLabel.classList.remove('active');
            activeLabel.removeAttribute('aria-selected');
          }
          label.classList.add('active');
          label.setAttribute('aria-selected', 'true');
          activeLabel = label;
          previewFile(node.fullPath, node.name);
        });

        item.appendChild(label);
        totalFiles++;
        updateLoadedFileCount();
      }

      return item;
    }

    function pathKey(value) {
      return String(value || '').replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
    }

    function applyLoadedTree(data) {
      const rootChanged = currentRoot && pathKey(currentRoot) !== pathKey(data.root);
      if (rootChanged) {
        rootContextId++;
        previewRequestId++;
        stopDashboardRequest();
        if (activePreviewController) activePreviewController.abort();
        activePreviewController = null;
        clearWordPreviewListeners();
        stopAudioPreview();
        currentContentView = 'placeholder';
        setDashboardButtonActive(false);
        document.getElementById('previewArea').innerHTML = '<div class="preview-placeholder"><div class="preview-seal">阅</div><div>管理目录已切换，请重新选择文件</div></div>';
      }

      currentRoot = data.root;
      localStorage.setItem('fileManager_root', currentRoot);
      const rootLabel = currentRoot.split(/[\\/]/).filter(Boolean).pop() || currentRoot;
      const rootLabelEl = document.getElementById('currentRootLabel');
      rootLabelEl.textContent = rootLabel;
      rootLabelEl.title = currentRoot;
      totalFiles = 0;
      activeLabel = null;
      const container = document.getElementById('treeContainer');
      container.innerHTML = '';
      container.appendChild(renderTree(data.data));
      updateLoadedFileCount();
      if (treeFilterQuery) applyTreeFilter();
      if (Array.isArray(data.skipped) && data.skipped.length > 0) {
        showToast(`目录已加载，但有 ${data.skipped.length} 个项目无法读取`, 'info');
      }
    }

    async function loadTree(options = {}) {
      const fallbackOnInvalid = Boolean(options && options.fallbackOnInvalid);
      const loadId = ++treeLoadId;
      const root = document.getElementById('rootPath').value.trim();
      const container = document.getElementById('treeContainer');
      container.innerHTML = '<div class="preview-placeholder"><div class="loading" style="width:24px;height:24px;border-width:2px;"></div><span style="font-size:13px;">正在翻阅目录...</span></div>';

      try {
        const url = root ? `/api/tree?root=${encodeURIComponent(root)}` : '/api/tree';
        const resp = await fetch(url);
        const data = await resp.json();
        if (loadId !== treeLoadId) return;

        if (!data.success) {
          if (root && fallbackOnInvalid) {
            localStorage.removeItem('fileManager_root');
            document.getElementById('rootPath').value = '';
            showToast('保存的路径已失效，已切换到默认目录', 'info');
            return loadTree({ fallbackOnInvalid: false });
          }
          container.innerHTML = `<div class="preview-placeholder"><span style="color:var(--danger);">错误: ${escapeHtml(data.error || '目录不可用')}</span></div>`;
          return false;
        }

        applyLoadedTree(data);
        showToast(`已加载目录: ${data.root}`, 'success');
        return true;
      } catch (e) {
        if (loadId !== treeLoadId) return;
        container.innerHTML = `<div class="preview-placeholder"><span style="color:var(--danger);">连接失败，请确保服务已启动</span></div>`;
        return false;

    // ===== Tree filter & keyboard =====
    let treeFilterQuery = '';
    let treeFilterTimer = null;

    function scheduleTreeFilter() {
      clearTimeout(treeFilterTimer);
      treeFilterTimer = setTimeout(applyTreeFilter, 120);
    }

    function renderTreeName(nameEl, query) {
      const name = nameEl.dataset.name || '';
      const index = query ? name.toLowerCase().indexOf(query) : -1;
      if (index < 0) {
        if (nameEl.firstElementChild) nameEl.textContent = name;
        return false;
      }
      nameEl.innerHTML = `${escapeHtml(name.slice(0, index))}<mark>${escapeHtml(name.slice(index, index + query.length))}</mark>${escapeHtml(name.slice(index + query.length))}`;
      return true;
    }

    function applyTreeFilter() {
      clearTimeout(treeFilterTimer);
      const container = document.getElementById('treeContainer');
      const meta = document.getElementById('treeFilterMeta');
      const query = treeFilterQuery;
      const rootItem = container.querySelector(':scope > .tree-item');
      container.querySelector(':scope > .tree-filter-empty')?.remove();
      container.classList.toggle('is-filtering', Boolean(query));
      let hits = 0;

      const visit = (item, ancestorHit) => {
        const nameEl = item.querySelector(':scope > .tree-label .tree-name');
        const selfHit = nameEl ? renderTreeName(nameEl, query) : false;
        if (selfHit) hits++;
        let childHit = false;
        const children = item.querySelector(':scope > .tree-children');
        if (children) {
          for (const child of children.querySelectorAll(':scope > .tree-item')) {
            if (visit(child, ancestorHit || selfHit)) childHit = true;
          }
          children.classList.toggle('filter-open', Boolean(query) && childHit);
        }
        item.classList.toggle('filter-miss', Boolean(query) && !(selfHit || childHit || ancestorHit));
        return selfHit || childHit;
      };

      if (rootItem) {
        const rootChildren = rootItem.querySelector(':scope > .tree-children');
        rootChildren?.querySelectorAll(':scope > .tree-item').forEach(child => visit(child, false));
        rootChildren?.classList.toggle('filter-open', Boolean(query));
      }

      meta.textContent = query ? (hits ? `${hits} 项` : '无匹配') : 'Ctrl K';
      meta.classList.toggle('has-result', Boolean(query && hits));
      if (query && hits === 0) {
        const empty = document.createElement('div');
        empty.className = 'tree-filter-empty';
        empty.textContent = `已加载的目录中没有“${query}”。展开更多文件夹后会继续匹配。`;
        container.appendChild(empty);
      }
    }

    function visibleTreeLabels() {
      return [...document.querySelectorAll('#treeContainer .tree-label')].filter(label => label.offsetParent !== null);
    }

    function focusTreeLabel(label) {
      if (!label) return;
      document.querySelectorAll('#treeContainer .tree-label[tabindex="0"]').forEach(el => { el.tabIndex = -1; });
      label.tabIndex = 0;
      label.focus();
      label.scrollIntoView({ block: 'nearest' });
    }

    function collapseTree() {
      const rootLabel = document.querySelector('#treeContainer .tree-label');
      [...document.querySelectorAll('#treeContainer .tree-children.open')].reverse().forEach(children => {
        const label = children.previousElementSibling;
        if (label && label !== rootLabel) label.click();
      });
      if (rootLabel) focusTreeLabel(rootLabel);
    }

    (function() {
      const input = document.getElementById('treeFilterInput');
      const container = document.getElementById('treeContainer');

      input.addEventListener('input', () => {
        treeFilterQuery = input.value.trim().toLowerCase();
        scheduleTreeFilter();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.stopPropagation();
          if (input.value) {
            input.value = '';
            treeFilterQuery = '';
            applyTreeFilter();
          } else {
            input.blur();
          }
        } else if (e.key === 'ArrowDown' || e.key === 'Enter') {
          e.preventDefault();
          const labels = visibleTreeLabels();
          focusTreeLabel(labels.find(label => label.querySelector('mark')) || labels[1] || labels[0]);
        }
      });

      container.addEventListener('click', (e) => {
        const label = e.target.closest && e.target.closest('.tree-label');
        if (label) focusTreeLabel(label);
      });

      container.addEventListener('keydown', (e) => {
        const label = e.target.closest && e.target.closest('.tree-label');
        if (!label) return;
        const labels = visibleTreeLabels();
        const index = labels.indexOf(label);
        const isDirectory = label.dataset.type === 'directory';
        const isOpen = isDirectory && label.nextElementSibling && label.nextElementSibling.offsetParent !== null;
        const userOpen = isDirectory && label.nextElementSibling && label.nextElementSibling.classList.contains('open');
        let handled = true;
        switch (e.key) {
          case 'ArrowDown': focusTreeLabel(labels[index + 1]); break;
          case 'ArrowUp': focusTreeLabel(labels[index - 1]); break;
          case 'Home': focusTreeLabel(labels[0]); break;
          case 'End': focusTreeLabel(labels[labels.length - 1]); break;
          case 'ArrowRight':
            if (isDirectory && !isOpen) label.click();
            else if (isOpen) focusTreeLabel(labels[index + 1]);
            break;
          case 'ArrowLeft':
            if (userOpen) label.click();
            else focusTreeLabel(label.parentElement.parentElement.closest('.tree-item')?.querySelector(':scope > .tree-label'));
            break;
          case 'Enter':
          case ' ':
            label.click();
            break;
          default: handled = false;
        }
        if (handled) e.preventDefault();
      });
    })();

    function formatAudioDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '';
      const totalSeconds = Math.floor(seconds);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const remainingSeconds = totalSeconds % 60;
      if (hours > 0) {
        return `${hours} 小时 ${String(minutes).padStart(2, '0')} 分 ${String(remainingSeconds).padStart(2, '0')} 秒`;
      }
      if (minutes > 0) return `${minutes} 分 ${String(remainingSeconds).padStart(2, '0')} 秒`;
      return `${remainingSeconds} 秒`;
    }

    function initAudioPreview(data) {
      const player = document.getElementById('audioPlayer');
      const duration = document.getElementById('audioDuration');
      const status = document.getElementById('audioPreviewStatus');
      const playbackRate = document.getElementById('audioPlaybackRate');
      if (!player || !duration || !status || !playbackRate) return;

      const supportedRates = new Set([0.5, 0.75, 1, 1.25, 1.5, 2]);
      const applyPlaybackRate = value => {
        const requestedRate = Number(value);
        const rate = supportedRates.has(requestedRate) ? requestedRate : 1;
        player.defaultPlaybackRate = rate;
        player.playbackRate = rate;
        playbackRate.value = String(rate);
      };
      applyPlaybackRate(1);
      playbackRate.addEventListener('change', () => applyPlaybackRate(playbackRate.value));

      const updateDuration = () => {
        if (!player.isConnected) return;
        const value = formatAudioDuration(player.duration);
        duration.textContent = value || '无法读取';
      };
      const showUnsupported = message => {
        if (!player.isConnected) return;
        duration.textContent = '无法读取';
        playbackRate.disabled = true;
        status.textContent = message;
        status.hidden = false;
      };

      player.addEventListener('loadedmetadata', updateDuration);
      player.addEventListener('durationchange', updateDuration);
      player.addEventListener('canplay', () => {
        if (!player.isConnected) return;
        playbackRate.disabled = false;
        status.hidden = true;
      });
      player.addEventListener('error', () => {
        const unsupported = player.error && player.error.code === 4;
        showUnsupported(unsupported
          ? `当前浏览器不支持 ${data.format || '此'} 音频格式，请使用本地播放器打开。`
          : '音频读取失败，请确认文件没有被移动、占用或损坏。');
      });

      if (data.mimeType && player.canPlayType(data.mimeType) === '') {
        showUnsupported(`当前浏览器不支持 ${data.format || '此'} 音频格式，请使用本地播放器打开。`);
      } else if (player.readyState >= 1) {
        updateDuration();
      }
    }

    function switchSheet(tab, sheetIndex, parentId) {
      const parent = parentId ? document.getElementById(parentId) : document;
      parent.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      parent.querySelectorAll('.sheet-content').forEach(c => c.style.display = 'none');
      const content = parent.querySelector(`.sheet-content[data-sheet-index="${sheetIndex}"]`);
      if (content) content.style.display = '';
    }

    function switchExcelView(view) {
      const original = document.getElementById('excelOriginalView');
      const reading = document.getElementById('excelReadingView');
      const btnO = document.getElementById('btnExcelOriginal');
      const btnR = document.getElementById('btnExcelReading');
      if (!original || !reading) return;

      if (view === 'original') {
        original.style.display = '';
        reading.style.display = 'none';
        btnO.classList.add('active');
        btnR.classList.remove('active');
      } else {
        original.style.display = 'none';
        reading.style.display = '';
        btnO.classList.remove('active');
        btnR.classList.add('active');
      }
    }

    // ===== Excel Column Filter (user-selectable filter row) =====
    function initExcelFilterUI() {
      const readingView = document.getElementById('excelReadingView');
      if (!readingView) return;
      readingView.querySelectorAll('.sheet-content').forEach(container => {
        if (container.querySelector('.filter-row-bar')) return;
        const table = container.querySelector('table');
        if (!table) return;
        const rows = table.querySelectorAll('tbody tr');
        if (rows.length === 0) return;

        // Build row selector bar
        const bar = document.createElement('div');
        bar.className = 'filter-row-bar';

        const label = document.createElement('span');
        label.textContent = '筛选行：';
        bar.appendChild(label);

        const sel = document.createElement('select');
        const noneOpt = document.createElement('option');
        noneOpt.value = '-1';
        noneOpt.textContent = '— 不筛选 —';
        sel.appendChild(noneOpt);

        const maxPreview = Math.min(rows.length, 30);
        for (let i = 0; i < maxPreview; i++) {
          const tr = rows[i];
          const rowNum = tr.getAttribute('data-row') || i;
          const cells = tr.querySelectorAll('td');
          let preview = '';
          for (let j = 0; j < Math.min(cells.length, 4); j++) {
            const t = (cells[j].textContent || '').trim().slice(0, 12);
            if (t) preview += (preview ? ' | ' : '') + t;
          }
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = `第 ${parseInt(rowNum) + 1} 行: ${preview || '(空)'}`;
          sel.appendChild(opt);
        }

        bar.appendChild(sel);

        const applyBtn = document.createElement('button');
        applyBtn.textContent = '设为筛选行';
        bar.appendChild(applyBtn);

        const clearBtn = document.createElement('button');
        clearBtn.textContent = '清除筛选';
        bar.appendChild(clearBtn);

        container.insertBefore(bar, table);

        applyBtn.addEventListener('click', () => {
          const idx = parseInt(sel.value);
          setFilterRow(container, table, idx);
        });

        clearBtn.addEventListener('click', () => {
          sel.value = '-1';
          setFilterRow(container, table, -1);
        });

        // Global keyword filter bar
        const kwBar = document.createElement('div');
        kwBar.className = 'keyword-filter-bar';

        const kwLabel = document.createElement('span');
        kwLabel.textContent = '关键词：';
        kwBar.appendChild(kwLabel);

        const kwInput = document.createElement('input');
        kwInput.type = 'text';
        kwInput.placeholder = '输入关键词过滤行（多个用空格分隔，支持模糊匹配）';
        kwBar.appendChild(kwInput);

        const kwBtn = document.createElement('button');
        kwBtn.textContent = '过滤';
        kwBar.appendChild(kwBtn);

        const kwClearBtn = document.createElement('button');
        kwClearBtn.textContent = '清除';
        kwBar.appendChild(kwClearBtn);

        container.insertBefore(kwBar, table);

        const doKwFilter = () => applyKeywordFilter(table, kwInput.value, kwBtn);

        kwBtn.addEventListener('click', doKwFilter);
        kwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doKwFilter(); });
        kwClearBtn.addEventListener('click', () => {
          kwInput.value = '';
          applyKeywordFilter(table, '', kwBtn);
        });
      });

      // Close dropdowns on outside click
      document.removeEventListener('click', closeAllFilterDropdowns);
      document.addEventListener('click', closeAllFilterDropdowns);
    }

    function closeAllFilterDropdowns() {
      document.querySelectorAll('.col-filter-dropdown.show').forEach(d => d.classList.remove('show'));
    }

    function setFilterRow(container, table, rowIdx) {
      const rows = table.querySelectorAll('tbody tr');

      // Clear previous filter state
      rows.forEach(tr => {
        tr.classList.remove('filter-row', 'filter-hidden');
        tr.querySelectorAll('.col-filter-wrap').forEach(w => w.remove());
      });

      if (rowIdx < 0 || rowIdx >= rows.length) return;

      const filterRow = rows[rowIdx];
      filterRow.classList.add('filter-row');

      const filterCells = filterRow.querySelectorAll('td');
      const dataRows = [...rows].filter((_, i) => i !== rowIdx);

      filterCells.forEach((td, colIdx) => {
        // Collect unique values from data rows at this column
        const values = new Set();
        dataRows.forEach(tr => {
          const cells = tr.querySelectorAll('td');
          if (cells[colIdx]) {
            const txt = (cells[colIdx].textContent || '').trim();
            if (txt) values.add(txt);
          }
        });

        if (values.size === 0) return;

        const wrap = document.createElement('span');
        wrap.className = 'col-filter-wrap';

        const btn = document.createElement('button');
        btn.className = 'col-filter-btn';
        btn.innerHTML = '&#9662;';
        btn.title = '筛选';

        const dropdown = document.createElement('div');
        dropdown.className = 'col-filter-dropdown';

        const actions = document.createElement('div');
        actions.className = 'col-filter-actions';
        const selAllBtn = document.createElement('button');
        selAllBtn.textContent = '全选';
        const clrBtn = document.createElement('button');
        clrBtn.textContent = '清除';
        actions.appendChild(selAllBtn);
        actions.appendChild(clrBtn);
        dropdown.appendChild(actions);

        // Search input inside dropdown
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'col-filter-search';
        searchInput.placeholder = '搜索...';
        dropdown.appendChild(searchInput);

        const sortedVals = [...values].sort();
        const checkboxes = [];
        const labels = [];
        sortedVals.forEach(val => {
          const lbl = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = true;
          cb.value = val;
          lbl.appendChild(cb);
          lbl.appendChild(document.createTextNode(val.length > 28 ? val.slice(0, 28) + '...' : val));
          dropdown.appendChild(lbl);
          checkboxes.push(cb);
          labels.push(lbl);
        });

        // Filter checkbox list by search keyword
        searchInput.addEventListener('input', () => {
          const kw = searchInput.value.trim().toLowerCase();
          labels.forEach((lbl, i) => {
            const match = !kw || sortedVals[i].toLowerCase().includes(kw);
            lbl.style.display = match ? '' : 'none';
          });
        });
        searchInput.addEventListener('click', (e) => e.stopPropagation());

        const doFilter = () => applyColumnFilters(table, rowIdx);

        selAllBtn.addEventListener('click', () => { checkboxes.forEach(cb => cb.checked = true); doFilter(); });
        clrBtn.addEventListener('click', () => { checkboxes.forEach(cb => cb.checked = false); doFilter(); });
        checkboxes.forEach(cb => cb.addEventListener('change', doFilter));

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.col-filter-dropdown.show').forEach(d => { if (d !== dropdown) d.classList.remove('show'); });
          dropdown.classList.toggle('show');
        });

        wrap.appendChild(btn);
        wrap.appendChild(dropdown);
        td.appendChild(wrap);
      });
    }

    function applyColumnFilters(table, filterRowIdx) {
      const rows = table.querySelectorAll('tbody tr');
      const filterRow = rows[filterRowIdx];
      if (!filterRow) return;

      const filterCells = filterRow.querySelectorAll('td');
      const filters = {};
      filterCells.forEach((td, ci) => {
        const wrap = td.querySelector('.col-filter-wrap');
        if (!wrap) return;
        const cbs = wrap.querySelectorAll('input[type="checkbox"]');
        if (cbs.length === 0) return;
        const allChecked = [...cbs].every(cb => cb.checked);
        if (allChecked) {
          wrap.querySelector('.col-filter-btn').classList.remove('active');
          return;
        }
        wrap.querySelector('.col-filter-btn').classList.add('active');
        const allowed = new Set();
        cbs.forEach(cb => { if (cb.checked) allowed.add(cb.value); });
        filters[ci] = allowed;
      });

      rows.forEach((tr, i) => {
        if (i === filterRowIdx) return;
        const cells = tr.querySelectorAll('td');
        let visible = true;
        for (const [ci, allowed] of Object.entries(filters)) {
          const cell = cells[parseInt(ci)];
          if (!cell) { visible = false; break; }
          const txt = (cell.textContent || '').trim();
          if (!allowed.has(txt)) { visible = false; break; }
        }
        tr.classList.toggle('filter-hidden', !visible);
      });
    }

    function applyKeywordFilter(table, keyword, kwBtn) {
      const rows = table.querySelectorAll('tbody tr');
      const kw = keyword.trim();

      // Clear highlights
      table.querySelectorAll('td.kw-highlight').forEach(td => td.classList.remove('kw-highlight'));

      if (!kw) {
        // Remove keyword filter, restore all rows (respect column filter)
        rows.forEach(tr => tr.classList.remove('kw-hidden'));
        if (kwBtn) kwBtn.classList.remove('active-kw');
        return;
      }

      if (kwBtn) kwBtn.classList.add('active-kw');

      // Split by space for multiple keywords (AND logic)
      const keywords = kw.toLowerCase().split(/\s+/).filter(k => k);

      rows.forEach(tr => {
        const cells = tr.querySelectorAll('td');
        const rowText = [...cells].map(c => (c.textContent || '').trim().toLowerCase()).join(' ');
        const match = keywords.every(k => rowText.includes(k));
        tr.classList.toggle('kw-hidden', !match);

        // Highlight matched cells
        if (match) {
          cells.forEach(cell => {
            const txt = (cell.textContent || '').toLowerCase();
            if (keywords.some(k => txt.includes(k))) {
              cell.classList.add('kw-highlight');
            }
          });
        }
      });
    }

    // ===== Word Search =====
    let _wordSearchMatches = [];
    let _wordSearchIdx = -1;

    function searchWord(keyword) {
      clearWordSearch();
      if (!keyword || !keyword.trim()) return;
      const original = document.getElementById('wordOriginalView');
      const reading = document.getElementById('wordReadingView');
      const container = (reading && reading.style.display !== 'none') ? document.getElementById('wordReadingBody') : document.getElementById('wordContainer');
      if (!container) return;
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      const kw = keyword.toLowerCase();
      nodes.forEach(node => {
        const text = node.textContent;
        const lower = text.toLowerCase();
        if (!lower.includes(kw)) return;
        const frag = document.createDocumentFragment();
        let lastIdx = 0;
        let idx = lower.indexOf(kw, 0);
        while (idx !== -1) {
          if (idx > lastIdx) frag.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
          const mark = document.createElement('mark');
          mark.className = 'word-search-hl';
          mark.style.cssText = 'background:#fbbf24;color:#111;border-radius:2px;padding:0 1px;';
          mark.textContent = text.substring(idx, idx + keyword.length);
          frag.appendChild(mark);
          lastIdx = idx + keyword.length;
          idx = lower.indexOf(kw, lastIdx);
        }
        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.substring(lastIdx)));
        node.parentNode.replaceChild(frag, node);
      });
      _wordSearchMatches = Array.from(container.querySelectorAll('.word-search-hl'));
      const countEl = document.getElementById('wordSearchCount');
      if (_wordSearchMatches.length > 0) {
        _wordSearchIdx = 0;
        scrollToWordMatch(0);
      } else if (countEl) {
        countEl.textContent = '无匹配';
      }
    }

    function wordSearchNav(dir) {
      if (_wordSearchMatches.length === 0) return;
      _wordSearchIdx = (_wordSearchIdx + dir + _wordSearchMatches.length) % _wordSearchMatches.length;
      scrollToWordMatch(_wordSearchIdx);
    }

    function scrollToWordMatch(idx) {
      _wordSearchMatches.forEach((el, i) => {
        el.style.background = i === idx ? '#f97316' : '#fbbf24';
        el.style.fontWeight = i === idx ? '700' : '';
      });
      _wordSearchMatches[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      const countEl = document.getElementById('wordSearchCount');
      if (countEl) countEl.textContent = `共 ${_wordSearchMatches.length} 处 | ${idx + 1} / ${_wordSearchMatches.length}`;
    }

    function clearWordSearch(clearInput) {
      const containers = [document.getElementById('wordContainer'), document.getElementById('wordReadingBody')];
      containers.forEach(c => {
        if (!c) return;
        c.querySelectorAll('.word-search-hl').forEach(el => {
          const text = document.createTextNode(el.textContent);
          el.parentNode.replaceChild(text, el);
        });
        c.normalize();
      });
      _wordSearchMatches = [];
      _wordSearchIdx = -1;
      const countEl = document.getElementById('wordSearchCount');
      if (countEl) countEl.textContent = '';
      if (clearInput) {
        const input = document.getElementById('wordSearchInput');
        if (input) input.value = '';
      }
    }

    // ===== Word Render (docx-preview) =====
    async function renderDocx(base64Data, serverHeadings, requestId) {
      const container = document.getElementById('wordContainer');
      if (!container) return;

      try {
        // Convert base64 to ArrayBuffer
        const binaryStr = atob(base64Data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });

        await docx.renderAsync(blob, container, null, {
          className: 'docx-preview',
          inWrapper: true,
          ignoreWidth: false,
          ignoreHeight: true,
          ignoreFonts: false,
          breakPages: true,
          renderHeaders: true,
          renderFooters: true,
          renderFootnotes: true,
          renderEndnotes: true,
        });

        if (requestId !== previewRequestId || !container.isConnected) return;

        // Build TOC using server-provided headings matched to rendered DOM
        buildWordToc(container, serverHeadings, requestId);
      } catch(e) {
        if (requestId !== previewRequestId || !container.isConnected) return;
        container.innerHTML = '<div style="padding:24px;color:var(--danger);">Word渲染失败: ' + escapeHtml(e.message) + '</div>';
      }
    }

    // Cache TOC links HTML for each view
    let _tocOriginalHtml = '';
    let _tocReadingHtml = '';
    let _tocReadingBuilt = false;

    function switchWordView(view) {
      clearWordSearch(true);
      const original = document.getElementById('wordOriginalView');
      const reading = document.getElementById('wordReadingView');
      const btnO = document.getElementById('btnViewOriginal');
      const btnR = document.getElementById('btnViewReading');
      const linksDiv = document.getElementById('wordTocLinks');
      if (!original || !reading) return;

      if (view === 'original') {
        original.style.display = '';
        reading.style.display = 'none';
        btnO.classList.add('active');
        btnR.classList.remove('active');
        if (linksDiv) { linksDiv.innerHTML = _tocOriginalHtml; bindTocClicks(linksDiv); }
      } else {
        original.style.display = 'none';
        reading.style.display = '';
        btnO.classList.remove('active');
        btnR.classList.add('active');
        if (!_tocReadingBuilt) { _tocReadingBuilt = true; buildReadingToc(); }
        if (linksDiv) { linksDiv.innerHTML = _tocReadingHtml; bindTocClicks(linksDiv); }
      }
    }

    function bindTocClicks(container) {
      container.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const target = document.getElementById(a.getAttribute('href').slice(1));
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            container.querySelectorAll('a').forEach(x => x.classList.remove('active'));
            a.classList.add('active');
          }
        });
      });
    }

    function buildReadingToc() {
      const body = document.getElementById('wordReadingBody');
      if (!body) return;
      const requestId = previewRequestId;

      const headings = body.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if (headings.length === 0) {
        _tocReadingHtml = '<div class="word-toc-empty">此文档无标题结构</div>';
        return;
      }

      let html = '';
      headings.forEach((h, i) => {
        const id = 'reading-toc-' + i;
        h.id = id;
        const level = parseInt(h.tagName.charAt(1));
        const text = (h.textContent || '').trim();
        const safeText = escapeHtml(text);
        html += `<a href="#${id}" data-level="${level}" title="${safeText}">${safeText}</a>`;
      });
      _tocReadingHtml = html;

      // Scroll spy for reading view
      const previewArea = document.getElementById('previewArea');
      if (previewArea) {
        const targets = [...headings];
        const handler = () => {
          if (requestId !== previewRequestId) return;
          const readingView = document.getElementById('wordReadingView');
          if (!readingView || readingView.style.display === 'none') return;
          const linksDiv = document.getElementById('wordTocLinks');
          if (!linksDiv) return;
          let current = null;
          targets.forEach(el => { if (el.getBoundingClientRect().top <= 120) current = el; });
          linksDiv.querySelectorAll('a').forEach(a => a.classList.remove('active'));
          if (current) {
            const link = linksDiv.querySelector(`a[href="#${current.id}"]`);
            if (link) link.classList.add('active');
          }
        };
        addWordScrollListener(previewArea, handler);
      }
    }

    function buildWordToc(body, serverHeadings, requestId = previewRequestId) {
      if (requestId !== previewRequestId || !body.isConnected) return;
      const linksDiv = document.getElementById('wordTocLinks');
      if (!linksDiv) return;

      let items = [];

      if (serverHeadings && serverHeadings.length > 0) {
        const allParas = body.querySelectorAll('p, h1, h2, h3, h4, h5, h6, span, div');
        const paraList = [...allParas].filter(el => {
          const t = (el.textContent || '').trim();
          return t && el.children.length <= 10;
        });

        let searchFrom = 0;
        serverHeadings.forEach((sh, i) => {
          const id = 'word-toc-' + i;
          for (let j = searchFrom; j < paraList.length; j++) {
            const elText = (paraList[j].textContent || '').trim();
            if (elText === sh.text || elText.startsWith(sh.text) || sh.text.startsWith(elText.slice(0, 10))) {
              paraList[j].id = id;
              items.push({ id, level: sh.level, text: sh.text });
              searchFrom = j + 1;
              break;
            }
          }
        });
      }

      if (items.length === 0) {
        const headings = body.querySelectorAll('h1, h2, h3, h4, h5, h6');
        headings.forEach((h, i) => {
          const id = 'word-toc-' + i;
          h.id = id;
          items.push({ id, level: parseInt(h.tagName.charAt(1)), text: (h.textContent || '').trim() });
        });
      }

      if (items.length === 0) {
        const allEls = body.querySelectorAll('[class*="Heading"], [class*="heading"]');
        allEls.forEach((el, i) => {
          const id = 'word-toc-' + i;
          el.id = id;
          const cls = el.className || '';
          const levelMatch = cls.match(/(\d)/);
          const level = levelMatch ? parseInt(levelMatch[1]) : 1;
          const text = (el.textContent || '').trim();
          if (text) items.push({ id, level: Math.min(level, 6), text });
        });
      }

      if (items.length === 0) {
        _tocOriginalHtml = '<div class="word-toc-empty">此文档无标题结构</div>';
        linksDiv.innerHTML = _tocOriginalHtml;
        return;
      }

      let html = '';
      items.forEach(item => {
        const safeText = escapeHtml(item.text);
        html += `<a href="#${item.id}" data-level="${item.level}" title="${safeText}">${safeText}</a>`;
      });
      _tocOriginalHtml = html;
      linksDiv.innerHTML = html;
      bindTocClicks(linksDiv);

      // Scroll spy for original view
      const previewArea = document.getElementById('previewArea');
      if (previewArea) {
        const allTargets = items.map(item => document.getElementById(item.id)).filter(Boolean);
        const handler = () => {
          if (requestId !== previewRequestId) return;
          const originalView = document.getElementById('wordOriginalView');
          if (!originalView || originalView.style.display === 'none') return;
          const ld = document.getElementById('wordTocLinks');
          if (!ld) return;
          let current = null;
          allTargets.forEach(el => { if (el.getBoundingClientRect().top <= 120) current = el; });
          ld.querySelectorAll('a').forEach(a => a.classList.remove('active'));
          if (current) {
            const link = ld.querySelector(`a[href="#${current.id}"]`);
            if (link) link.classList.add('active');
          }
        };
        addWordScrollListener(previewArea, handler);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function inlineJsString(value) {
      return escapeHtml(JSON.stringify(String(value == null ? '' : value)));
    }

    function sanitizePreviewHtml(html) {
      const template = document.createElement('template');
      template.innerHTML = String(html || '');
      template.content.querySelectorAll('script,iframe,object,embed,form,input,button,textarea,select,option,link,meta,base,style,svg,math').forEach(node => node.remove());
      const allowedAttributes = new Set(['href', 'src', 'alt', 'title', 'colspan', 'rowspan', 'width', 'height', 'start']);
      template.content.querySelectorAll('*').forEach(node => {
        [...node.attributes].forEach(attribute => {
          const name = attribute.name.toLowerCase();
          if (!allowedAttributes.has(name)) {
            node.removeAttribute(attribute.name);
            return;
          }
          if (name === 'href') {
            const value = attribute.value.trim();
            if (!value.startsWith('#') && !/^(https?:|mailto:)/i.test(value)) node.removeAttribute(attribute.name);
          }
          if (name === 'src' && !/^data:image\/(png|jpe?g|gif|bmp|webp);base64,/i.test(attribute.value.trim())) {
            node.removeAttribute(attribute.name);
          }
        });
        if (node.tagName === 'A' && node.hasAttribute('href') && !node.getAttribute('href').startsWith('#')) {
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        }
      });
      return template.innerHTML;
    }

    // ===== SSE Helper =====
    function ssePost(url, body, { onProgress, onDone, onError, signal }) {
      let settled = false;
      const fail = error => {
        if (settled) return;
        settled = true;
        if (onError) {
          try { onError(error); } catch (callbackError) { console.error(callbackError); }
        }
      };
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal }).then(resp => {
        if (!resp.ok || !resp.body) throw new Error(`服务器返回 ${resp.status}`);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        function read() {
          reader.read().then(({ done, value }) => {
            if (done) {
              if (!settled && !(signal && signal.aborted)) fail(new Error('服务器连接提前结束'));
              return;
            }
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              try {
                const msg = JSON.parse(line.slice(6));
                if (msg.type === 'progress' && onProgress) onProgress(msg);
                else if (msg.type === 'done' && !settled) {
                  if (onDone) onDone(msg);
                  settled = true;
                }
              } catch(e) {
                fail(new Error(`无法处理服务器响应：${e.message}`));
                return;
              }
            }
            if (settled) return;
            read();
          }).catch(fail);
        }
        read();
      }).catch(fail);
    }

    function formatFileSize(size) {
      if (!Number.isFinite(size)) return '';
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      if (size < 1024 * 1024 * 1024) return `${(size / 1024 / 1024).toFixed(1)} MB`;
      if (size < 1024 * 1024 * 1024 * 1024) return `${(size / 1024 / 1024 / 1024).toFixed(1)} GB`;
      return `${(size / 1024 / 1024 / 1024 / 1024).toFixed(1)} TB`;
    }

    function formatFileTime(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN', { hour12: false });
    }

    function dashboardCount(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? Math.trunc(number) : 0;
    }

    function dashboardBarWidth(value, maximum) {
      const count = dashboardCount(value);
      const max = dashboardCount(maximum);
      if (count === 0 || max === 0) return 0;
      return Math.max(3, Math.round(count / max * 100));
    }

    function dashboardModuleDefinitions() {
      return [
        { key: 'normal', label: '正常记录', series: 'normal', empty: '当前目录中没有正常记录文件。' },
        { key: 'backup', label: '备份文件夹', series: 'backup', empty: '目录中没有“备份文件夹”，或其中暂无文件。' },
        { key: 'revoked', label: '撤回文件夹', series: 'revoked', empty: '目录中没有“撤回文件夹”，或其中暂无文件。' }
      ];
    }

    function setDashboardButtonActive(active) {
      const button = document.getElementById('dashboardButton');
      if (!button) return;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    }

    function stopDashboardRequest() {
      const scan = activeDashboardScan;
      if (scan) {
        scan.cancelled = true;
        scan.controller.abort();
        activeDashboardScan = null;
      }
      dashboardData = null;
      dashboardRequestId++;
    }

    function renderDashboardHeader(root, actions = '', meta = '') {
      return `<div class="dashboard-header">
        <div>
          <h2 class="dashboard-title">统计概览</h2>
          <div class="dashboard-subtitle"><span class="dashboard-root" title="${escapeHtml(root).replace(/"/g, '&quot;')}">${escapeHtml(root)}</span>${meta ? `<span>${escapeHtml(meta)}</span>` : ''}</div>
        </div>
        ${actions ? `<div class="dashboard-actions">${actions}</div>` : ''}
      </div>`;
    }

    function renderDashboardLoading(root) {
      const area = document.getElementById('previewArea');
      area.innerHTML = `<div class="dashboard">
        ${renderDashboardHeader(root, '<button class="btn btn-danger" type="button" onclick="cancelDashboardScan()">取消统计</button>')}
        <div class="dashboard-loading-card" role="status">
          <span class="dashboard-loading-count" id="dashboardProgressCount">0</span>
          <span class="dashboard-loading-label">个文件已扫描 · 只读统计，不会修改文件</span>
          <div class="task-progress-bar indeterminate"><span></span></div>
          <div class="dashboard-current-file" id="dashboardCurrentFile">正在读取目录...</div>
        </div>
      </div>`;
      area.scrollTop = 0;
    }

    function updateDashboardProgress(message) {
      const count = document.getElementById('dashboardProgressCount');
      const file = document.getElementById('dashboardCurrentFile');
      if (count) count.textContent = dashboardCount(message.current);
      if (file) file.textContent = message.file || '';
    }

    function renderDashboardState(title, detail) {
      const area = document.getElementById('previewArea');
      area.innerHTML = `<div class="dashboard">
        ${renderDashboardHeader(currentRoot, '<button class="btn btn-primary" type="button" onclick="showDashboard()">重新统计</button>')}
        <div class="dashboard-empty-state"><div class="result-item info"><div class="result-file">${escapeHtml(title)}</div><div class="result-detail">${escapeHtml(detail)}</div></div></div>
      </div>`;
      area.scrollTop = 0;
    }

    function cancelDashboardScan(showResult = true) {
      if (!activeDashboardScan) return;
      stopDashboardRequest();
      if (showResult && currentContentView === 'dashboard') {
        renderDashboardState('统计已取消', '扫描是只读操作，没有修改任何文件。');
      }
    }

    function renderDashboardModuleCards(activeModule, data) {
      const modules = data.modules || {};
      const audioModules = (data.audio && data.audio.modules) || {};
      const definitions = dashboardModuleDefinitions();
      const totalFiles = definitions.reduce((sum, module) => sum + dashboardCount((modules[module.key] || {}).files), 0);
      const share = key => totalFiles > 0 ? dashboardCount((modules[key] || {}).files) / totalFiles * 100 : 0;
      const distribution = definitions.map(module => `<span class="dashboard-series-${module.series}" style="width:${share(module.key).toFixed(2)}%" title="${module.label} ${share(module.key).toFixed(1)}%"></span>`).join('');
      const cards = definitions.map(module => {
        const summary = modules[module.key] || {};
        const active = module.key === activeModule;
        return `<button class="dashboard-module module-${module.key}${active ? ' active' : ''}" id="dashboardTab-${module.key}" type="button" role="tab" tabindex="${active ? 0 : -1}" aria-selected="${active}" aria-controls="dashboardViewPanel" onclick="switchDashboardModule('${module.key}')">
          <span class="dashboard-module-head"><span>${module.label}</span><span class="dashboard-module-share">${share(module.key).toFixed(1)}%</span></span>
          <span class="dashboard-module-value"><strong>${dashboardCount(summary.files)}</strong><span>个文件</span></span>
          <span class="dashboard-module-meta">
            <span><b>${dashboardCount(summary.directories)}</b><small>文件夹</small></span>
            <span><b>${formatFileSize(Number(summary.bytes) || 0) || '0 B'}</b><small>占用空间</small></span>
            <span><b>${dashboardCount((audioModules[module.key] || {}).total)}</b><small>音频</small></span>
          </span>
        </button>`;
      }).join('');
      return `<div class="dashboard-caption"><h3>模块分布</h3><span>共 ${totalFiles} 个文件 · 点击模块查看明细</span></div>
        <div class="dashboard-distribution" role="img" aria-label="${escapeHtml(definitions.map(module => `${module.label} ${share(module.key).toFixed(1)}%`).join('，'))}">${distribution}</div>
        <div class="dashboard-modules" role="tablist" aria-label="统计模块" onkeydown="dashboardTabKey(event)">${cards}</div>`;
    }

    function dashboardTabKey(event) {
      const keys = dashboardModuleDefinitions().map(module => module.key);
      const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
      if (!step) return;
      event.preventDefault();
      const next = keys[(keys.indexOf(dashboardActiveModule) + step + keys.length) % keys.length];
      switchDashboardModule(next);
      document.getElementById(`dashboardTab-${next}`)?.focus();
    }

    function switchDashboardModule(moduleKey) {
      if (!dashboardData || !dashboardModuleDefinitions().some(module => module.key === moduleKey)) return;
      const area = document.getElementById('previewArea');
      const scrollTop = area.scrollTop;
      dashboardActiveModule = moduleKey;
      renderDashboard(dashboardData);
      area.scrollTop = scrollTop;
    }

    function renderDashboardEpisodes(folders, documents) {
      const maximum = Math.max(1, folders, documents);
      const row = (label, value) => `<div class="dashboard-episode-row">
        <span class="dashboard-episode-label">${label}</span>
        <div class="dashboard-bar-track" role="img" aria-label="${escapeHtml(`${label} ${value} 个`)}"><span class="dashboard-bar-fill" style="width:${dashboardBarWidth(value, maximum)}%;background:var(--module-color)"></span></div>
        <span class="dashboard-episode-value">${value}</span>
      </div>`;
      let note = { cls: '', text: '没有名称含“第N集”的文件夹或 Word 文档。' };
      if (folders > 0 || documents > 0) {
        const diff = Math.abs(folders - documents);
        note = diff === 0
          ? { cls: 'is-balanced', text: `文件夹与 Word 文档数量一致，均为 ${folders} 个。` }
          : { cls: 'is-diff', text: `Word 文档比剧集文件夹${documents < folders ? '少' : '多'} ${diff} 个。` };
      }
      return `<div class="dashboard-block">
        <div class="dashboard-caption"><h3>剧集记录</h3><span>名称含“第N集”</span></div>
        ${row('剧集文件夹', folders)}
        ${row('Word 文档', documents)}
        <div class="dashboard-episode-note ${note.cls}">${escapeHtml(note.text)}</div>
      </div>`;
    }

    function dashboardAudioDefinitions() {
      return [
        { key: 'body', label: '正文音频', description: '文件名含“第N集”', series: 'body', color: 'var(--primary)' },
        { key: 'normalEncore', label: '正常返场', description: '不含“第N集”，且文件名不含“撤回”', series: 'normal-encore', color: 'var(--success)' },
        { key: 'revokedEncore', label: '撤回返场', description: '不含“第N集”，且文件名含“撤回”', series: 'revoked-encore', color: '#2563a8' }
      ];
    }

    function renderDashboardAudioPie(audio = {}) {
      const definitions = dashboardAudioDefinitions();
      const total = definitions.reduce((sum, item) => sum + dashboardCount(audio[item.key]), 0);
      let cursor = 0;
      const segments = definitions.map((item, index) => {
        const start = cursor;
        cursor = index === definitions.length - 1
          ? 100
          : cursor + (total > 0 ? dashboardCount(audio[item.key]) / total * 100 : 0);
        return `${item.color} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
      });
      const style = total > 0
        ? `background:conic-gradient(${segments.join(',')})`
        : 'background:var(--surface-2)';
      const accessibleLabel = definitions.map(item => `${item.label} ${dashboardCount(audio[item.key])} 个`).join('，');
      const list = definitions.map(item => {
        const count = dashboardCount(audio[item.key]);
        const percent = total > 0 ? count / total * 100 : 0;
        return `<div class="dashboard-audio-item">
          <span class="dashboard-audio-name"><span class="dashboard-swatch dashboard-series-${item.series}"></span>${item.label}</span>
          <span class="dashboard-audio-count"><strong>${count}</strong> 个 · ${percent.toFixed(1)}%</span>
          <div class="dashboard-bar-track" role="img" aria-label="${escapeHtml(`${item.label}：${count} 个，占全部音频 ${percent.toFixed(1)}%`)}"><span class="dashboard-bar-fill dashboard-series-${item.series}" style="width:${count > 0 ? Math.max(2, percent).toFixed(2) : 0}%"></span></div>
          <span class="dashboard-audio-desc">${item.description}</span>
        </div>`;
      }).join('');
      const body = total > 0
        ? `<div class="dashboard-audio">
            <div class="dashboard-pie" role="img" aria-label="${escapeHtml(accessibleLabel)}" style="${style}"><div class="dashboard-pie-center"><strong>${total}</strong><span>个音频</span></div></div>
            <div class="dashboard-audio-list">${list}</div>
          </div>`
        : '<div class="dashboard-empty-module"><strong>暂无音频</strong>没有 mp3、wav、m4a 等音频文件。</div>';
      return `<div class="dashboard-block">
        <div class="dashboard-caption"><h3>音频构成</h3><span>${total > 0 ? `共 ${formatFileSize(Number(audio.bytes) || 0)}` : ''}</span></div>
        ${body}
      </div>`;
    }

    function renderDashboard(data) {
      const modules = data.modules || {};
      const episodes = data.episodes || {};
      const audio = data.audio || {};
      const definitions = dashboardModuleDefinitions();
      dashboardData = data;
      if (!definitions.some(module => module.key === dashboardActiveModule)) dashboardActiveModule = 'normal';
      const activeDefinition = definitions.find(module => module.key === dashboardActiveModule) || definitions[0];
      const moduleSummary = modules[activeDefinition.key] || {};
      const moduleAudio = audio.modules && audio.modules[activeDefinition.key] ? audio.modules[activeDefinition.key] : {};
      const moduleFiles = dashboardCount(moduleSummary.files);
      const episodeFolders = episodes.folders || {};
      const episodeWordDocuments = episodes.wordDocuments || {};
      const moduleEpisodeFolders = dashboardCount(episodeFolders[activeDefinition.key]);
      const moduleEpisodeWordDocuments = dashboardCount(episodeWordDocuments[activeDefinition.key]);
      const skipped = Array.isArray(data.skipped) ? data.skipped : [];
      const generatedAt = formatFileTime(data.generatedAt) || '刚刚';
      const excluded = dashboardCount(data.excludedDirectories);
      const scanMeta = `共读取 ${dashboardCount(data.scannedFiles)} 个文件、${dashboardCount(data.scannedDirectories)} 个目录${excluded > 0 ? `，忽略 ${excluded} 个程序、日志或目录联接` : ''}`;

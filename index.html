  <script defer src="libs/jszip.min.js"></script>
  <script defer src="libs/docx-preview.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #c0392b;
      --on-primary: #ffffff;
      --primary-hover: #a93226;
      --primary-muted: #f5d6d0;
      --ink: #2c1810;
      --ink-muted: #5c4033;
      --ink-subtle: #8b7355;
      --ink-tertiary: #b0a08a;
      --canvas: #f7f3eb;
      --surface-1: #ede8dd;
      --surface-2: #e3dccf;
      --surface-3: #d6cebf;
      --hairline: #d4c9b5;
      --hairline-strong: #bfb49e;
      --danger: #c0392b;
      --danger-hover: #a93226;
      --warning: #d4a017;
      --warning-hover: #b8860b;
      --success: #27713a;
      --success-hover: #1e5c2e;
      --word-badge: #7b4a2e;
      --excel-badge: #3a6b35;
      --image-badge: #6b4c8a;
      --text-badge: #8b7355;
      --folder-icon: #c49a3c;
      --folder-open: #a67c2e;
      --overlay: rgba(44,24,16,0.5);
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: var(--canvas);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header — 卷首 */
    .header {
      background: var(--surface-1);
      color: var(--ink);
      padding: 0 24px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 2px solid var(--primary);
      z-index: 10;
    }

    .header h1 {
      font-family: 'SimSun', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
    }

    .header h1 svg { width: 22px; height: 22px; stroke: var(--primary); }

    .brand-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 4px 2px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-trigger:hover { color: var(--primary); }
    .brand-trigger:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .brand-trigger svg { flex: 0 0 auto; }

    .motto-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(31,20,16,0.84);
      backdrop-filter: blur(4px);
      cursor: pointer;
    }

    .motto-overlay.show { display: flex; }

    .motto-plaque {
      --motto-accent: rgba(224,188,112,0.9);
      --motto-accent-soft: rgba(224,188,112,0.34);
      --motto-text: #f1d79e;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(680px, 92vw);
      min-height: 220px;
      padding: 46px 72px;
      border: 1px solid var(--motto-accent);
      border-radius: 2px;
      background: rgba(28,18,14,0.08);
      color: var(--motto-text);
      box-shadow: inset 0 0 0 6px rgba(10,6,4,0.12), inset 0 0 0 7px var(--motto-accent-soft), 0 24px 68px rgba(0,0,0,0.28);
      backdrop-filter: blur(2px);
      font-family: 'STKaiti', 'KaiTi', 'FangSong', 'SimSun', serif;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .motto-plaque::before {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px solid var(--motto-accent-soft);
      pointer-events: none;
    }

    .motto-plaque::after {
      content: '';
      position: absolute;
      inset: 23px 28px;
      border-top: 1px solid var(--motto-accent-soft);
      border-bottom: 1px solid var(--motto-accent-soft);
      pointer-events: none;
    }

    .motto-plaque:hover {
      border-color: var(--motto-accent);
      background: rgba(224,188,112,0.035);
      box-shadow: inset 0 0 0 6px rgba(10,6,4,0.11), inset 0 0 0 7px rgba(224,188,112,0.46), 0 26px 72px rgba(0,0,0,0.3);
    }
    .motto-plaque:active { transform: translateY(1px); }
    .motto-plaque:focus-visible { outline: 3px solid var(--primary-muted); outline-offset: 4px; }

    .motto-plaque-text {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 500px;
    }

    .motto-plaque-character {
      color: var(--motto-text);
      font-size: 72px;
      font-weight: 600;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(29,17,11,0.72), 0 0 18px rgba(224,188,112,0.22);
    }

    .motto-plaque.compact {
      --motto-accent: rgba(141,91,28,0.76);
      --motto-accent-soft: rgba(141,91,28,0.24);
      --motto-text: #92352b;
      width: min(540px, 88vw);
      min-height: 168px;
      padding: 34px 52px;
      background: rgba(247,243,235,0.14);
      box-shadow: inset 0 0 0 6px rgba(247,243,235,0.28), inset 0 0 0 7px var(--motto-accent-soft), 0 12px 30px rgba(44,24,16,0.08);
    }

    .motto-plaque.compact:hover {
      background: rgba(192,57,43,0.025);
      box-shadow: inset 0 0 0 6px rgba(247,243,235,0.24), inset 0 0 0 7px rgba(141,91,28,0.34), 0 14px 34px rgba(44,24,16,0.1);
    }
    .motto-plaque.compact .motto-plaque-character {
      font-size: 54px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9), 0 0 13px rgba(146,53,43,0.12);
    }

    .motto-plaque-corner {
      position: absolute;
      z-index: 2;
      width: 38px;
      height: 38px;
      pointer-events: none;
    }

    .motto-plaque-corner::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      border: 1px solid var(--motto-accent);
      transform: rotate(45deg);
    }

    .motto-plaque-corner.top-left { top: 7px; left: 7px; border-top: 2px solid var(--motto-accent); border-left: 2px solid var(--motto-accent); }
    .motto-plaque-corner.top-right { top: 7px; right: 7px; border-top: 2px solid var(--motto-accent); border-right: 2px solid var(--motto-accent); }
    .motto-plaque-corner.bottom-left { bottom: 7px; left: 7px; border-bottom: 2px solid var(--motto-accent); border-left: 2px solid var(--motto-accent); }
    .motto-plaque-corner.bottom-right { right: 7px; bottom: 7px; border-right: 2px solid var(--motto-accent); border-bottom: 2px solid var(--motto-accent); }

    .motto-plaque-corner.top-left::after { top: 7px; left: 7px; }
    .motto-plaque-corner.top-right::after { top: 7px; right: 7px; }
    .motto-plaque-corner.bottom-left::after { bottom: 7px; left: 7px; }
    .motto-plaque-corner.bottom-right::after { right: 7px; bottom: 7px; }

    .motto-plaque-crest {
      position: absolute;
      left: 50%;
      z-index: 2;
      width: 118px;
      height: 18px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .motto-plaque-crest::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      border-top: 1px solid var(--motto-accent-soft);
    }

    .motto-plaque-crest::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 1px solid var(--motto-accent);
      background: rgba(28,18,14,0.22);
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .motto-plaque-crest.top { top: -9px; }
    .motto-plaque-crest.bottom { bottom: -9px; transform: translateX(-50%) rotate(180deg); }
    .motto-plaque.compact .motto-plaque-crest::after { background: rgba(247,243,235,0.82); }

    .welcome-placeholder {
      justify-content: flex-start;
      padding-top: 18px;
    }

    .welcome-motto-slot {
      display: flex;
      justify-content: center;
      width: 100%;
      flex: 0 0 auto;
    }

    .welcome-copy {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      gap: 12px;
      padding-bottom: 70px;
    }

    @keyframes motto-overlay-enter {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }

    .motto-overlay.show .motto-plaque { animation: motto-overlay-enter 0.28s ease-out; }

    @keyframes motto-spark-fly {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--spark-angle)) scaleY(0.45); }
      45% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--spark-angle)) scaleY(0.08); }
    }

    .motto-spark {
      position: fixed;
      width: 4px;
      height: 10px;
      border-radius: 999px;
      pointer-events: none;
      animation: motto-spark-fly 0.68s ease-out forwards;
      z-index: 622;
    }

    @keyframes motto-word-fly {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      10% { opacity: 1; transform: translate(-50%, -50%) scale(0.9); }
      68% { opacity: 1; transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rotation)) scale(1); }
      88% { opacity: 1; transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rotation)) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rotation)) scale(1.02); }
    }

    .motto-effect-word {
      position: fixed;
      z-index: 621;
      opacity: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(242,209,139,0.96);
      text-shadow: 0 0 7px rgba(242,209,139,0.72), 0 1px 2px rgba(44,24,16,0.8);
      font-family: 'STKaiti', 'KaiTi', 'FangSong', 'SimSun', serif;
      font-size: 24px;
      font-weight: 600;
      pointer-events: none;
      animation: motto-word-fly 2.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      animation-delay: var(--delay);
    }

    .motto-effect-word.on-canvas {
      color: rgba(169,50,38,0.94);
      text-shadow: 0 0 7px rgba(192,57,43,0.36), 0 1px 2px rgba(255,255,255,0.9);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .current-root-label {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink-muted);
      font-size: 12px;
      padding-right: 10px;
      border-right: 1px solid var(--hairline);
    }

    .btn-icon {
      width: auto;
      min-width: 58px;
      height: 34px;
      padding: 0 9px;
      justify-content: center;
      flex: 0 0 auto;
    }

    .btn-icon svg { display: block; width: 17px; height: 17px; min-width: 17px; stroke: currentColor; }
    .header-action-text { display: inline-block; font-size: 12px; line-height: 1; }

    .root-path {
      background: var(--canvas);
      border: 1px solid var(--hairline-strong);
      color: var(--ink);
      padding: 7px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Microsoft YaHei', sans-serif;
      width: 340px;
      outline: none;
      transition: border-color 0.2s;
    }

    .root-path:focus { border-color: var(--primary); }
    .root-path::placeholder { color: var(--ink-tertiary); }

    .btn {
      padding: 7px 18px;
      background: transparent;
      border: 1px solid var(--hairline-strong);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Microsoft YaHei', sans-serif;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      position: relative;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(44,24,16,0.1); }
    .btn:active { transform: translateY(0); box-shadow: none; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary-hover);
    }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 2px 8px rgba(192,57,43,0.25); }
    .btn-primary:active { background: #8b2820; }

    .btn-danger {
      background: transparent;
      border: 1.5px solid var(--danger);
      color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 2px 8px rgba(192,57,43,0.2); }
    .btn-danger:active { background: var(--danger-hover); color: #fff; }

    .btn-warning {
      background: transparent;
      border: 1.5px solid #b8860b;
      color: #9a7209;
    }
    .btn-warning:hover { background: #b8860b; color: #fff; box-shadow: 0 2px 8px rgba(184,134,11,0.2); }
    .btn-warning:active { background: #9a7209; color: #fff; }

    .btn-success {
      background: transparent;
      border: 1.5px solid var(--success);
      color: var(--success);
    }
    .btn-success:hover { background: var(--success); color: #fff; box-shadow: 0 2px 8px rgba(39,113,58,0.2); }
    .btn-success:active { background: var(--success-hover); color: #fff; }

    .btn-outline {
      border: 1px solid var(--hairline-strong);
      color: var(--ink-muted);
    }
    .btn-outline:hover { background: var(--surface-1); color: var(--ink); border-color: var(--ink-subtle); }
    .btn-outline:active { background: var(--surface-2); }

    .btn svg { width: 15px; height: 15px; }

    .btn-tip {
      display: inline-flex;
      align-items: center;
      margin-left: 2px;
      cursor: help;
    }
    .btn-tip svg { width: 14px; height: 14px; opacity: 0.7; }
    .btn-tip:hover svg { opacity: 1; }

    .tip-bubble {
      position: fixed;
      background: linear-gradient(135deg, #2c1810, #3d2b1f);
      color: #f7f3eb;
      font-size: 12px;
      font-weight: 400;
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      padding: 8px 14px;
      border-radius: 4px;
      max-width: 300px;
      white-space: normal;
      letter-spacing: 0.2px;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 16px rgba(44,24,16,0.25), 0 1px 4px rgba(44,24,16,0.15);
      border: 1px solid rgba(196,154,60,0.15);
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .tip-bubble.show { opacity: 1; transform: scale(1); }
    .tip-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
    }
    .tip-bubble.tip-up::after {
      top: 100%;
      border-top-color: #3d2b1f;
    }
    .tip-bubble.tip-down::after {
      bottom: 100%;
      border-bottom-color: #2c1810;
    }

    /* Main Layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar — 目录卷 */
    .sidebar {
      width: 280px;
      min-width: 200px;
      background: var(--surface-1);
      border-right: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--hairline);
      font-family: 'SimSun', serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      color: var(--ink-muted);
    }

    .tree-container {
      flex: 1;
      overflow: auto;
      padding: 4px 0;
    }

    /* Tree — 典籍目录 */
    .tree-item { user-select: none; }

    .tree-label {
      display: flex;
      align-items: center;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ink-muted);
      transition: all 0.12s ease;
      gap: 4px;
      border-left: 2px solid transparent;
    }

    .tree-label:hover {
      background: var(--surface-2);
      color: var(--ink);
      padding-left: 14px;
    }

    .tree-label:active {
      background: var(--surface-3);
      padding-left: 12px;
    }

    .tree-label.active {
      background: var(--primary-muted);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 500;
    }

    .tree-toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--ink-tertiary);
      transition: transform 0.15s;
    }

    .tree-toggle.expanded { transform: rotate(90deg); }
    .tree-toggle.hidden { visibility: hidden; }

    .tree-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-right: 4px;
    }

    .tree-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-children {
      display: none;
      padding-left: 14px;
    }

    .tree-children.open { display: block; }

    /* Content — 正文 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      gap: 8px;
      background: var(--surface-1);
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-note {
      margin-left: auto;
      color: var(--ink-subtle);
      font-size: 12px;
      white-space: nowrap;
    }

    .selection-list {
      max-height: 48vh;
      overflow: auto;
      border: 1px solid var(--hairline);
      background: var(--surface-1);
      margin: 12px 0;
    }

    .selection-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--hairline);
      background: var(--surface-2);
    }

    .selection-summary {
      color: var(--ink-muted);
      font-size: 13px;
    }

    .selection-toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .selection-toolbar .btn {
      padding: 5px 12px;
      min-height: 30px;
    }

    .selection-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--hairline);
      align-items: start;
    }

    .selection-row:last-child { border-bottom: 0; }
    .selection-row:hover { background: var(--surface-2); }
    .selection-row input { margin-top: 3px; }
    .selection-file { color: var(--ink); font-weight: 600; word-break: break-all; }
    .doc-preview-link { border: 0; padding: 0; background: none; color: var(--primary); text-align: left; text-decoration: underline; cursor: pointer; font: inherit; }
    .selection-detail { margin-top: 4px; color: var(--ink-subtle); font-size: 12px; line-height: 1.6; }

    .task-progress {
      padding: 18px;
      border: 1px solid var(--hairline);
      background: var(--surface-1);
    }

    .task-progress-bar {
      height: 8px;
      background: var(--surface-3);
      overflow: hidden;
      margin: 12px 0 8px;
    }

    .task-progress-bar span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .task-progress-bar.indeterminate span {
      width: 35%;
      animation: task-indeterminate 1.2s ease-in-out infinite;
    }

    @keyframes task-indeterminate {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }

    .task-progress-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .task-current-file {
      color: var(--ink-subtle);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--hairline);
      background: var(--surface-1);
      margin-bottom: 12px;
    }

    .result-summary-item {
      padding: 10px 12px;
      text-align: center;
      border-right: 1px solid var(--hairline);
    }

    .result-summary-item:last-child { border-right: 0; }
    .result-summary-count { display: block; font-size: 20px; font-weight: 700; line-height: 1.2; }
    .result-summary-label { display: block; margin-top: 3px; color: var(--ink-subtle); font-size: 11px; }
    .result-summary-item.success .result-summary-count { color: var(--success); }
    .result-summary-item.skipped .result-summary-count { color: #9a7209; }
    .result-summary-item.failed .result-summary-count { color: var(--danger); }

    .issue-details {
      margin: 10px 0;
      border: 1px solid var(--hairline);
      background: var(--surface-1);
    }

    .issue-details summary {
      padding: 8px 10px;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .issue-details-body {
      max-height: 180px;
      overflow: auto;
      padding: 0 10px 8px;
    }

    .issue-row {
      padding: 6px 0;
      border-top: 1px solid var(--hairline);
      color: var(--ink-muted);
      font-size: 12px;
      word-break: break-all;
    }

    .tree-loading,
    .tree-empty {
      padding: 7px 12px 7px 44px;
      color: var(--ink-subtle);
      font-size: 11px;
    }

    .tree-more {
      display: block;
      width: calc(100% - 12px);
      margin: 4px 6px;
      padding: 7px 10px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      background: var(--surface-1);
      color: var(--primary);
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .tree-more:hover { background: var(--surface-2); }
    .tree-more:disabled { color: var(--ink-subtle); cursor: wait; }

    .danger-note {
      padding: 10px 12px;
      border-left: 3px solid var(--danger);
      background: #f9e5e1;
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .header { padding: 0 14px; }
      .header h1 { font-size: 17px; letter-spacing: 1px; }
      .current-root-label { max-width: 180px; }
      .toolbar-note { display: none; }
    }

    .preview-area {
      flex: 1;
      overflow: auto;
      padding: 24px 32px;
      background: var(--canvas);
      position: relative;
    }

    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink-tertiary);
      gap: 12px;
    }

    .preview-placeholder svg { width: 48px; height: 48px; opacity: 0.25; stroke: var(--ink-subtle); }

    .preview-title {
      font-family: 'SimSun', serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      color: var(--ink);
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .preview-title-name { min-width: 0; word-break: break-all; }
    .preview-title-meta { color: var(--ink-subtle); font-family: 'Microsoft YaHei', sans-serif; font-size: 11px; font-weight: 400; }

    .audio-preview {
      width: min(720px, 100%);
      margin: 28px auto 0;
    }

    .preview-area .audio-info-table {
      table-layout: fixed;
      margin-bottom: 20px;
      border-top: 1px solid var(--hairline-strong);
      border-bottom: 1px solid var(--hairline-strong);
    }

    .preview-area .audio-info-table th,
    .preview-area .audio-info-table td {
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      text-align: left;
      vertical-align: middle;
    }

    .preview-area .audio-info-table tr:last-child th,
    .preview-area .audio-info-table tr:last-child td { border-bottom: 0; }
    .preview-area .audio-info-table tr:hover th,
    .preview-area .audio-info-table tr:hover td { background: var(--surface-1); }
    .preview-area .audio-info-table th { width: 84px; color: var(--ink-subtle); font-weight: 500; white-space: nowrap; }
    .preview-area .audio-info-table td { color: var(--ink); word-break: break-word; }

    .audio-player {
      display: block;
      flex: 1 1 420px;
      min-width: 240px;
      height: 54px;
    }

    .audio-player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .audio-speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 4px 5px 4px 8px;
      border: 1px solid var(--hairline-strong);
      border-radius: 6px;
      background: var(--surface-1);
      color: var(--ink-muted);
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
    }

    .audio-speed-control:hover {
      border-color: var(--primary);
      background: var(--canvas);
    }

    .audio-speed-control:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-muted);
    }

    .audio-speed-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding-right: 2px;
      font-weight: 600;
    }

    .audio-speed-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: 1px solid var(--primary-muted);
      border-radius: 50%;
      background: var(--canvas);
      color: var(--primary);
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
    }

    .audio-speed-control select {
      min-height: 34px;
      min-width: 74px;
      padding: 5px 7px;
      border: 0;
      border-left: 1px solid var(--hairline);
      border-radius: 0 3px 3px 0;
      background: transparent;
      color: var(--primary);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .audio-speed-control select:focus {
      outline: 0;
    }

    .audio-speed-control select:disabled { opacity: 0.55; cursor: not-allowed; }

    .audio-preview-status {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid var(--warning);
      background: var(--warning-bg);
      color: var(--ink-muted);
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      line-height: 1.6;
    }

    /* Dashboard — 统计概览 */
    .dashboard {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      color: var(--ink);
    }

    .dashboard-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--primary);
    }

    .dashboard-title {
      margin: 0;
      font-family: 'SimSun', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .dashboard-subtitle {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      margin-top: 8px;
      color: var(--ink-subtle);
      font-size: 12px;
      line-height: 1.6;
    }

    .dashboard-root {
      max-width: 520px;
      padding: 1px 9px;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: var(--surface-1);
      color: var(--ink-muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .dashboard-caption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .dashboard-caption h3 {
      font-family: 'SimSun', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--ink);
    }

    .dashboard-caption span {
      color: var(--ink-subtle);
      font-size: 11.5px;
    }

    .dashboard-distribution {
      display: flex;
      height: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-2);
    }

    .dashboard-distribution span {
      height: 100%;
      transition: width 0.4s var(--ease-out);
    }

    .dashboard-distribution span + span { box-shadow: -2px 0 0 var(--canvas); }

    .module-normal { --module-color: #8b5a2b; --module-soft: rgba(139,90,43,0.12); }
    .module-backup { --module-color: #6b4c8a; --module-soft: rgba(107,76,138,0.12); }
    .module-revoked { --module-color: #2563a8; --module-soft: rgba(37,99,168,0.12); }

    .dashboard-modules {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .dashboard-module {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      padding: 14px 16px 14px 20px;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface-1);
      color: var(--ink);
      font-family: 'Microsoft YaHei', sans-serif;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s var(--ease-out), background-color 0.18s;
    }

    .dashboard-module::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--module-color);
      opacity: 0.4;
      transition: opacity 0.18s;
    }

    .dashboard-module:hover { transform: translateY(-2px); border-color: var(--hairline-strong); box-shadow: var(--shadow-md); }
    .dashboard-module.active { border-color: var(--module-color); background: #fbf8f2; box-shadow: 0 0 0 1px var(--module-color), var(--shadow-md); }
    .dashboard-module.active::before { opacity: 1; }

    .dashboard-module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .dashboard-module.active .dashboard-module-head { color: var(--module-color); }

    .dashboard-module-share {
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--module-soft);
      color: var(--module-color);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dashboard-module-value { display: flex; align-items: baseline; gap: 6px; }

    .dashboard-module-value strong {
      color: var(--ink);
      font-family: 'SimSun', serif;
      font-size: 30px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .dashboard-module-value span { color: var(--ink-subtle); font-size: 12px; }

    .dashboard-module-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding-top: 10px;
      border-top: 1px dashed var(--hairline-strong);
    }

    .dashboard-module-meta > span { min-width: 0; }

    .dashboard-module-meta b {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-module-meta small { color: var(--ink-subtle); font-size: 10.5px; }

    .dashboard-panel {
      padding: 20px 22px 22px;
      border: 1px solid var(--hairline);
      border-top: 3px solid var(--module-color);
      border-radius: 8px;
      background: rgba(250,247,240,0.72);
      box-shadow: var(--shadow-sm);
    }

    .dashboard-panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-family: 'SimSun', serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .dashboard-panel-title i {
      width: 9px;
      height: 9px;
      background: var(--module-color);
      transform: rotate(45deg);
    }

    .dashboard-panel-grid {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 18px;
    }

    .dashboard-block {
      min-width: 0;
      padding: 16px 18px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      background: var(--canvas);
    }

    .dashboard-episode-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
    }

    .dashboard-episode-row + .dashboard-episode-row { border-top: 1px dashed var(--hairline); }
    .dashboard-episode-label { color: var(--ink-muted); font-size: 12.5px; }

    .dashboard-episode-value {
      font-family: 'SimSun', serif;
      font-size: 20px;
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .dashboard-episode-note {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 5px;
      background: var(--surface-1);
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .dashboard-episode-note.is-balanced { background: rgba(39,113,58,0.08); color: var(--success); }
    .dashboard-episode-note.is-diff { background: var(--warning-bg); color: #8a6508; }

    .dashboard-bar-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-2);
    }

    .dashboard-bar-fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s var(--ease-out);
    }

    .dashboard-audio {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      align-items: center;
      gap: 22px;
    }

    .dashboard-pie {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
    }

    .dashboard-pie::after {
      content: '';
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background: var(--canvas);
      box-shadow: inset 0 0 0 1px var(--hairline);
    }

    .dashboard-pie-center {
      position: absolute;
      inset: 28px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ink-subtle);
      font-size: 11px;
    }

    .dashboard-pie-center strong {
      color: var(--ink);
      font-family: 'SimSun', serif;
      font-size: 28px;
      line-height: 1.1;
    }

    .dashboard-audio-list { display: grid; gap: 13px; min-width: 0; }

    .dashboard-audio-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 5px 12px;
    }

    .dashboard-audio-name {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .dashboard-audio-count { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }
    .dashboard-audio-count strong { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
    .dashboard-audio-item .dashboard-bar-track { grid-column: 1 / -1; height: 8px; }
    .dashboard-audio-desc { grid-column: 1 / -1; color: var(--ink-subtle); font-size: 11px; }

    .dashboard-swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 3px;
    }

    .dashboard-series-normal { background: #8b5a2b; }
    .dashboard-series-backup { background: #6b4c8a; }
    .dashboard-series-revoked { background: #2563a8; }
    .dashboard-series-body { background: var(--primary); }
    .dashboard-series-normal-encore { background: var(--success); }
    .dashboard-series-revoked-encore { background: #2563a8; }

    .dashboard-empty-module {
      padding: 34px 16px;
      color: var(--ink-subtle);
      font-size: 12.5px;
      line-height: 1.8;
      text-align: center;
    }

    .dashboard-empty-module strong {
      display: block;
      color: var(--ink-muted);
      font-family: 'SimSun', serif;
      font-size: 16px;
    }

    .dashboard-scan-meta {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--hairline);
      color: var(--ink-subtle);
      font-size: 11px;
      line-height: 1.6;
    }

    .dashboard-warning {
      margin-top: 12px;
      padding: 9px 11px;
      border-left: 3px solid var(--warning);
      background: var(--warning-bg);
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .dashboard-empty-state { padding: 20px 0; color: var(--ink-muted); }

    .dashboard-loading-card {
      max-width: 520px;
      margin: 28px auto 0;
      padding: 28px 30px 22px;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: rgba(250,247,240,0.82);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .dashboard-loading-count {
      display: block;
      color: var(--ink);
      font-family: 'SimSun', serif;
      font-size: 40px;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .dashboard-loading-label { color: var(--ink-subtle); font-size: 12px; }
    .dashboard-loading-card .task-progress-bar { margin: 18px 0 10px; }

    .dashboard-current-file {
      min-height: 18px;
      overflow: hidden;
      color: var(--ink-subtle);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #dashboardButton.active {
      background: var(--primary-muted);
      border-color: var(--primary);
      color: var(--primary);
    }

    @media (prefers-reduced-motion: reduce) {
      .dashboard-bar-fill { transition: none; }
      .motto-overlay.show .motto-plaque { animation: none; }
      .motto-spark { display: none; }
      .motto-effect-word {
        opacity: 1;
        animation: none;
        transform: translate(-50%, -50%) translate(var(--tx), var(--ty));
      }
    }

    @media (max-width: 820px) {
      .header-action-text { display: none; }
      .btn-icon { width: 34px; min-width: 34px; padding: 0 8px; }
      .current-root-label { max-width: 120px; }
    }

    @media (max-width: 1000px) {
      .dashboard-module-value strong { font-size: 24px; }
      .dashboard-panel-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .result-summary { grid-template-columns: 1fr; }
      .result-summary-item { border-right: 0; border-bottom: 1px solid var(--hairline); }
      .result-summary-item:last-child { border-bottom: 0; }
      .audio-preview { margin-top: 16px; }
      .preview-area .audio-info-table tr { display: grid; grid-template-columns: 72px minmax(0, 1fr); }
      .preview-area .audio-info-table th { width: auto; }
      .audio-player-row { align-items: stretch; }
      .audio-player { flex-basis: 100%; min-width: 0; }
      .audio-speed-control { align-self: flex-end; margin-left: auto; }
      .header { padding: 0 10px; }
      .header h1 { font-size: 16px; letter-spacing: 0; }
      .header h1 svg { display: none; }
      .brand-section { display: none; }
      .current-root-label { display: none; }
      .header-actions { gap: 4px; }
      .preview-area { padding: 18px 14px; }
      .welcome-placeholder { padding-top: 8px; }
      .welcome-copy { padding-bottom: 36px; }
      .motto-overlay { padding: 16px; }
      .motto-plaque { width: min(520px, 94vw); min-height: 174px; padding: 32px 38px; }
      .motto-plaque .motto-plaque-character { font-size: 52px; }
      .motto-plaque.compact { width: min(410px, 90vw); min-height: 132px; padding: 24px 32px; }
      .motto-plaque.compact .motto-plaque-character { font-size: 40px; }
      .motto-plaque-corner { width: 30px; height: 30px; }
      .motto-plaque-crest { width: 88px; }
      .dashboard-header { align-items: stretch; flex-direction: column; }
      .dashboard-actions { align-self: flex-start; }
      .dashboard-modules { grid-template-columns: 1fr; }
      .dashboard-panel { padding: 16px 14px; }
      .dashboard-audio { grid-template-columns: 1fr; justify-items: center; }
      .dashboard-audio-list { width: 100%; }
      .dashboard-caption { flex-direction: column; gap: 2px; }
    }

    /* Excel Table — 表格 */
    .preview-area table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    .preview-area table td {
      border: 1px solid var(--hairline);
      padding: 7px 12px;
      text-align: left;
      vertical-align: middle;
      background: var(--canvas);
      color: var(--ink-muted);
    }

    .preview-area table tr:nth-child(even) td { background: var(--surface-1); }
    .preview-area table tr:hover td { background: var(--surface-2); color: var(--ink); }
    .preview-area table tr.filter-hidden { display: none; }
    .preview-area table tr.kw-hidden { display: none; }

    /* Filter header row — user selected */
    .preview-area table tr.filter-row td {
      background: var(--surface-2);
      color: var(--ink);
      font-weight: 600;
      font-size: 12px;
      position: relative;
      cursor: default;
    }

    /* Right-click hint on hover */
    .preview-area table tr:not(.filter-row) td { cursor: context-menu; }

    /* Filter row selector bar */
    .filter-row-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .filter-row-bar span { font-weight: 500; }

    .filter-row-bar select {
      padding: 4px 8px;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      background: var(--canvas);
      color: var(--ink);
      font-size: 12px;
      font-family: 'Microsoft YaHei', sans-serif;
      outline: none;
    }

    .filter-row-bar select:focus { border-color: var(--primary); }

    .filter-row-bar button {
      padding: 4px 12px;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    .filter-row-bar button:hover { background: var(--surface-3); color: var(--ink); }
    .filter-row-bar button.active-filter { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

    /* Column filter */
    .col-filter-wrap {
      display: inline-block;
      position: relative;
      margin-left: 6px;
      vertical-align: middle;
    }

    .col-filter-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: var(--ink-subtle);
      font-size: 11px;
      line-height: 1;
      vertical-align: middle;
    }

    .col-filter-btn:hover { color: var(--primary); }
    .col-filter-btn.active { color: var(--primary); }

    .col-filter-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 50;
      background: var(--canvas);
      border: 1px solid var(--hairline-strong);
      border-radius: 4px;
      box-shadow: 0 4px 12px rgba(44,24,16,0.15);
      padding: 8px;
      min-width: 160px;
      max-height: 240px;
      overflow-y: auto;
    }

    .col-filter-dropdown.show { display: block; }

    .col-filter-dropdown label {
      display: block;
      padding: 3px 4px;
      font-size: 12px;
      font-weight: 400;
      color: var(--ink-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-filter-dropdown label:hover { background: var(--surface-1); color: var(--ink); }

    .col-filter-dropdown input[type="checkbox"] { margin-right: 6px; accent-color: var(--primary); }

    .col-filter-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--hairline);
    }

    .col-filter-actions button {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      background: var(--surface-1);
      color: var(--ink-muted);
      cursor: pointer;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    .col-filter-actions button:hover { background: var(--surface-2); color: var(--ink); }

    .col-filter-search {
      width: 100%;
      padding: 4px 8px;
      margin-bottom: 6px;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      font-size: 12px;
      font-family: 'Microsoft YaHei', sans-serif;
      background: var(--canvas);
      color: var(--ink);
      outline: none;
    }

    .col-filter-search:focus { border-color: var(--primary); }
    .col-filter-search::placeholder { color: var(--ink-tertiary); }

    /* Global keyword filter bar */
    .keyword-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 8px 12px;
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-radius: 4px;
    }

    .keyword-filter-bar span {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .keyword-filter-bar input {
      flex: 1;
      padding: 5px 10px;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      font-size: 13px;
      font-family: 'Microsoft YaHei', sans-serif;
      background: var(--canvas);
      color: var(--ink);
      outline: none;
    }

    .keyword-filter-bar input:focus { border-color: var(--primary); }
    .keyword-filter-bar input::placeholder { color: var(--ink-tertiary); }

    .keyword-filter-bar button {
      padding: 5px 14px;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
    }

    .keyword-filter-bar button:hover { background: var(--surface-3); color: var(--ink); }
    .keyword-filter-bar button.active-kw { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

    .preview-area table td.kw-highlight { background: var(--primary-muted) !important; color: var(--primary) !important; font-weight: 500; }

    /* Text Preview — 古文风 */
    .text-preview {
      background: var(--surface-1);
      color: var(--ink);
      padding: 24px;
      border-radius: 4px;
      font-family: 'SimSun', serif;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-all;
      overflow: auto;
      border: 1px solid var(--hairline);
    }

    /* Word Preview — docx-preview + TOC */
    .word-wrap { display: flex; gap: 0; max-width: 1200px; margin: 0 auto; }

    .word-toc {
      width: 220px;
      min-width: 180px;
      flex-shrink: 0;
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-right: none;
      border-top: 3px solid var(--primary);
      border-radius: 4px 0 0 4px;
      padding: 16px 0;
      overflow-y: auto;
      max-height: 80vh;
      position: sticky;
      top: 0;
      align-self: flex-start;
    }

    .word-toc-title {
      font-family: 'SimSun', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      padding: 0 16px 10px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .word-toc a {
      display: block;
      padding: 4px 16px;
      font-size: 13px;
      color: var(--ink-muted);
      text-decoration: none;
      line-height: 1.6;
      border-left: 2px solid transparent;
      transition: all 0.12s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .word-toc a:hover { color: var(--ink); background: var(--surface-2); }
    .word-toc a.active { color: var(--primary); border-left-color: var(--primary); font-weight: 500; }

    .word-toc a[data-level="2"] { padding-left: 28px; }
    .word-toc a[data-level="3"] { padding-left: 40px; font-size: 12px; }
    .word-toc a[data-level="4"] { padding-left: 52px; font-size: 12px; }
    .word-toc a[data-level="5"] { padding-left: 60px; font-size: 11px; }
    .word-toc a[data-level="6"] { padding-left: 68px; font-size: 11px; }

    .word-toc-empty {
      padding: 12px 16px;
      font-size: 12px;
      color: var(--ink-tertiary);
    }

    .word-preview-container {
      flex: 1;
      min-width: 0;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-top: 3px solid var(--primary);
      border-radius: 0 4px 4px 0;
      overflow: hidden;
    }

    .word-preview-container.no-toc {
      border-radius: 4px;
    }

    .word-preview-container .docx-wrapper {
      background: white !important;
      padding: 20px !important;
    }

    /* Word view switcher — inside TOC */
    .word-view-bar {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 4px;
    }

    .word-view-btn {
      flex: 1;
      padding: 4px 0;
      border: 1px solid var(--hairline-strong);
      border-radius: 3px;
      background: var(--surface-1);
      color: var(--ink-muted);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Microsoft YaHei', sans-serif;
      text-align: center;
    }

    .word-view-btn:hover { background: var(--surface-2); color: var(--ink); transform: translateY(-1px); }
    .word-view-btn:active { background: var(--surface-3); transform: translateY(0); }
    .word-view-btn.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .word-view-btn.active:hover { background: var(--primary-hover); }

    /* Reading view (mammoth) */
    .word-reading-view {
      flex: 1;
      min-width: 0;
      background: var(--canvas);
      color: var(--ink);
      padding: 32px 40px;
      border: 1px solid var(--hairline);
      border-top: 3px solid var(--primary);
      border-radius: 0 4px 4px 0;
      line-height: 1.9;
      font-size: 15px;
    }

    .word-reading-view h1, .word-reading-view h2, .word-reading-view h3,
    .word-reading-view h4, .word-reading-view h5, .word-reading-view h6 {
      font-family: 'SimSun', serif;
      color: var(--ink);
      margin: 20px 0 10px;
    }

    .word-reading-view h1 { font-size: 22px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
    .word-reading-view h2 { font-size: 19px; border-bottom: 1px solid var(--hairline); padding-bottom: 6px; }
    .word-reading-view h3 { font-size: 16px; }

    .word-reading-view p { margin-bottom: 10px; text-indent: 2em; }
    .word-reading-view table { margin: 12px 0; border-collapse: collapse; width: 100%; }
    .word-reading-view table td, .word-reading-view table th { border: 1px solid var(--hairline); padding: 6px 10px; }
    .word-reading-view img { max-width: 100%; height: auto; }

    /* Scroll float buttons — 悬浮导航 */
    .scroll-float {
      position: fixed;
      right: 32px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .scroll-float.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-float-top { top: 80px; }
    .scroll-float-bottom { bottom: 24px; }

    .scroll-float button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--hairline-strong);
      background: var(--surface-1);
      color: var(--ink-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(44,24,16,0.12);
      transition: all 0.15s;
    }

    .scroll-float button:hover {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
      transform: scale(1.1);
    }

    .scroll-float button:active {
      transform: scale(0.95);
      background: var(--primary-hover);
    }

    .scroll-float button svg { width: 16px; height: 16px; }

    /* Sheet Tabs — 卷册切换 */
    .sheet-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .sheet-tab {
      padding: 6px 16px;
      border: 1px solid var(--hairline);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--ink-subtle);
      transition: all 0.15s;
    }

    .sheet-tab:hover { background: var(--surface-1); color: var(--ink); transform: translateY(-1px); }
    .sheet-tab:active { background: var(--surface-3); transform: translateY(0); }
    .sheet-tab.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .sheet-tab.active:hover { background: var(--primary-hover); }

    /* Excel view switcher */
    .excel-view-bar {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin-bottom: 10px;
    }

    .excel-view-btn {
      padding: 5px 14px;
      border: 1px solid var(--hairline-strong);
      border-radius: 4px;
      background: var(--surface-1);
      color: var(--ink-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    .excel-view-btn:hover { background: var(--surface-2); color: var(--ink); transform: translateY(-1px); }
    .excel-view-btn:active { background: var(--surface-3); transform: translateY(0); }
    .excel-view-btn.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .excel-view-btn.active:hover { background: var(--primary-hover); }

    .excel-original-view {
      width: 100%;
      max-height: 70vh;
      overflow: auto;
      border: 1px solid var(--hairline-strong);
      border-radius: 4px;
      background: var(--canvas);
      position: relative;
    }

    .excel-original-view table { border-collapse: collapse; table-layout: auto; }
    .excel-original-view td, .excel-original-view th {
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.4;
    }

    .excel-original-view thead th {
      background: var(--surface-2);
      border: 1px solid var(--hairline);
      padding: 3px 8px;
      font-weight: 500;
      font-size: 11px;
      color: var(--ink-muted);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .excel-original-view tbody th {
      background: var(--surface-2);
      border: 1px solid var(--hairline);
      padding: 3px 6px;
      font-weight: 400;
      font-size: 11px;
      color: var(--ink-muted);
      text-align: center;
      min-width: 36px;
      position: sticky;
      left: 0;
      z-index: 1;
    }

    .excel-original-view thead th:first-child {
      position: sticky;
      left: 0;
      z-index: 3;
    }

    /* Modal — 告示牌 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--canvas);
      border: 1px solid var(--hairline-strong);
      border-top: 3px solid var(--primary);
      border-radius: 4px;
      padding: 24px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow: auto;
      box-shadow: 0 8px 32px rgba(44,24,16,0.2);
    }

    .modal h3 {
      font-family: 'SimSun', serif;
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--ink);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--hairline);
    }

    .result-item {
      padding: 10px 14px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 13px;
      background: var(--surface-1);
    }

    .result-item.success { border-left: 3px solid var(--success); }
    .result-item.error { border-left: 3px solid var(--danger); }
    .result-item.info { border-left: 3px solid var(--warning); }

    .result-file { font-weight: 600; word-break: break-all; color: var(--ink); }
    .result-detail { color: var(--ink-subtle); margin-top: 6px; font-size: 12px; }

    /* Loading */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--hairline);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast — 飞鸽传书 */
    .toast-container {
      position: fixed;
      top: 60px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 10px 20px;
      border-radius: 4px;
      color: var(--on-primary);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(44,24,16,0.15);
      animation: slideIn 0.3s ease;
      max-width: 400px;
    }

    .toast.success { background: #2d6a6a; }
    .toast.error { background: var(--danger); }
    .toast.info { background: #9a7209; color: #fff; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Resize handle */
    .resize-handle {
      width: 3px;
      cursor: col-resize;
      background: transparent;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .resize-handle:hover { background: var(--primary); }

    /* File count badge — 册数 */
    .badge {
      background: var(--primary-muted);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface-1); }
    ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-tertiary); }

    /* Image Preview */
    .image-preview { max-width: 100%; max-height: 600px; border-radius: 4px; border: 1px solid var(--hairline); box-shadow: 0 2px 8px rgba(44,24,16,0.1); }

    /* Modal strong/code in results */
    .modal strong { color: var(--ink); }
    .modal code { background: var(--surface-2); padding: 2px 6px; border-radius: 2px; font-size: 12px; color: var(--primary); font-family: 'Microsoft YaHei', monospace; }
    .modal p { color: var(--ink-muted); line-height: 1.6; }

    /* ===== 精修层 — 纸本与朱印 ===== */
    :root {
      --warning-bg: #fbf1d6;
      --gold-soft: rgba(176,138,62,0.32);
      --seal-ink: #fff8ec;
      --shadow-sm: 0 1px 2px rgba(44,24,16,0.08);
      --shadow-md: 0 6px 18px rgba(44,24,16,0.14);
      --shadow-lg: 0 22px 56px rgba(44,24,16,0.24);
      --ease-out: cubic-bezier(0.22, 0.8, 0.24, 1);
      --focus-ring: 0 0 0 2px var(--canvas), 0 0 0 4px rgba(192,57,43,0.55);
      --seal-font: 'STKaiti', 'KaiTi', 'FangSong', 'SimSun', serif;
    }

    body {
      background:
        radial-gradient(1100px 560px at 88% -12%, rgba(196,154,60,0.11), transparent 62%),
        radial-gradient(900px 520px at -12% 112%, rgba(192,57,43,0.05), transparent 60%),
        var(--canvas);
    }

    ::selection { background: rgba(192,57,43,0.18); color: var(--ink); }

    :where(button, a, input, select, summary, [tabindex]):focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* 卷首：朱线 + 金线双栏 */
    .header {
      position: relative;
      background: linear-gradient(180deg, #f4efe4 0%, var(--surface-1) 100%);
    }

    .header::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5px;
      height: 1px;
      background: var(--gold-soft);
      pointer-events: none;
    }

    .brand-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 4px 3px 5px 3px;
      background: var(--primary);
      color: var(--seal-ink);
      font-family: var(--seal-font);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      box-shadow: inset 0 0 0 2px var(--primary), inset 0 0 0 3px rgba(255,248,236,0.72), 0 2px 6px rgba(192,57,43,0.25);
      transform: rotate(-5deg);
      transition: transform 0.35s var(--ease-out);
    }

    .brand-trigger:hover .brand-seal { transform: rotate(0deg) scale(1.08); }
    .brand-trigger:active .brand-seal { transform: rotate(0deg) scale(0.94); }

    .current-root-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      margin-right: 4px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: rgba(247,243,235,0.7);
    }

    .current-root-label::before {
      content: '';
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(39,113,58,0.14);
    }

    /* 按钮 */
    .btn {
      border-radius: 5px;
      transition: background-color 0.18s var(--ease-out), color 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.18s var(--ease-out);
    }

    .btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }

    .btn-primary {
      background: linear-gradient(180deg, #cc4536 0%, var(--primary) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), var(--shadow-sm);
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #bd392b 0%, var(--primary-hover) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 14px rgba(192,57,43,0.28);
    }

    .btn-primary:active { background: #8b2820; }

    .btn-icon:hover { background: var(--canvas); color: var(--primary); border-color: var(--primary-muted); }

    .btn.is-busy { pointer-events: none; }
    .btn.is-busy > svg:first-child { animation: spin 0.8s linear infinite; }

    .btn-xs { padding: 3px 10px; font-size: 11px; min-height: 24px; }

    .toolbar {
      gap: 10px;
      padding: 12px 20px;
      background: linear-gradient(180deg, var(--surface-1) 0%, #e9e3d6 100%);
    }

    .toolbar > .btn { min-height: 38px; padding: 8px 18px; font-size: 13.5px; }

    /* 侧栏：卷目 */

    .sidebar-header {

      gap: 8px;

    .sidebar-title::before {

      height: 14px;
      border-radius: 2px;
      background: var(--primary);
    }

    .sidebar-header-actions { display: inline-flex; align-items: center; gap: 6px; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--ink-subtle);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .icon-btn:hover { background: var(--canvas); color: var(--primary); border-color: var(--hairline); }
    .icon-btn svg { width: 14px; height: 14px; }

    .tree-search {
      position: relative;
      padding: 8px 10px;
      border-bottom: 1px solid var(--hairline);
    }

    .tree-search-icon {
      position: absolute;
      top: 50%;
      left: 20px;
      width: 14px;
      height: 14px;
      color: var(--ink-tertiary);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .tree-search input {
      width: 100%;
      padding: 7px 62px 7px 30px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      background: var(--canvas);
      color: var(--ink);
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .tree-search input::placeholder { color: var(--ink-tertiary); }
    .tree-search input::-webkit-search-cancel-button { display: none; }
    .tree-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(192,57,43,0.12); }

    .tree-search-meta {
      position: absolute;
      top: 50%;
      right: 18px;
      padding: 1px 6px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      background: var(--surface-1);
      color: var(--ink-subtle);
      font-size: 10.5px;
      line-height: 1.5;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .tree-search-meta.has-result { border-color: var(--primary-muted); color: var(--primary); }

    .tree-label {
      position: relative;
      margin: 1px 6px;
      border-left: 0;
      border-radius: 5px;
      outline: none;
      transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .tree-label.active {
      background: linear-gradient(90deg, var(--primary-muted) 0%, rgba(245,214,208,0.35) 100%);
      box-shadow: inset 3px 0 0 var(--primary);

    .tree-label:focus-visible { box-shadow: inset 0 0 0 2px rgba(192,57,43,0.5); }
    .tree-label.active:focus-visible { box-shadow: inset 3px 0 0 var(--primary), inset 0 0 0 2px rgba(192,57,43,0.5); }

    .tree-children { position: relative; }

    .tree-children::before {
      content: '';

      top: 2px;
      bottom: 6px;
      left: var(--guide, 26px);

    .tree-children.open > .tree-item { animation: tree-in 0.22s var(--ease-out) both; }

    @keyframes tree-in {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: none; }
    }

    .tree-container.is-filtering .tree-item.filter-miss { display: none; }
    .tree-container.is-filtering .tree-children.filter-open { display: block; }
    .tree-name mark { padding: 0 1px; border-radius: 2px; background: rgba(212,160,23,0.36); color: inherit; }

    .tree-filter-empty {
      padding: 26px 18px;

      font-size: 12px;
      line-height: 1.7;
      text-align: center;

    .resize-handle { position: relative; width: 4px; }
    .resize-handle::after {
      content: '';

      top: 50%;
      left: 50%;

      height: 28px;

    /* 预览区 */
    .preview-area > * { animation: preview-in 0.28s var(--ease-out) both; }

    @keyframes preview-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }

    .preview-title { align-items: center; }

    .preview-title-meta {
      padding: 2px 9px;
      border: 1px solid var(--hairline);

    }

    .preview-title-side { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .preview-seal {

      align-items: center;

      height: 56px;

    .text-preview, .word-toc, .word-preview-container, .excel-original-view, .image-preview { box-shadow: var(--shadow-sm); }

    /* 弹窗 */
    .modal-overlay.show { animation: overlay-in 0.2s ease both; }

    @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      border-radius: 8px;

    .confirm-seal {

      align-items: center;
      justify-content: center;

      height: 40px;

      font-family: var(--seal-font);

    .result-item { transition: background-color 0.15s; }
    .result-item:hover { background: #f2ede2; }

    .issue-details-tools { display: flex; justify-content: flex-end; padding: 6px 0; }

    .task-progress-bar { border-radius: 999px; }

    /* 飞鸽传书 */
    .toast-container { top: 66px; pointer-events: none; }

    .toast,
    .toast.success,
    .toast.error,
    .toast.info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px 9px 10px;

      background: rgba(250,247,240,0.97);

      box-shadow: var(--shadow-md);
      cursor: pointer;
      pointer-events: auto;
      animation: toast-in 0.32s var(--ease-out);

    .toast.success { --toast-accent: var(--success); }
    .toast.error { --toast-accent: var(--danger); }
    .toast.info { --toast-accent: #9a7209; }
    .toast.leaving { animation: toast-out 0.26s ease forwards; }

    .toast-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      border-radius: 3px;
      background: var(--toast-accent);
      color: var(--seal-ink);
      font-family: var(--seal-font);
      font-size: 14px;
      font-weight: 700;
      transform: rotate(-5deg);
    }

    .toast-text { min-width: 0; line-height: 1.5; word-break: break-all; }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(28px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    @keyframes toast-out { to { opacity: 0; transform: translateX(28px); } }

    kbd {
      padding: 1px 5px;
      border: 1px solid var(--hairline-strong);
      border-bottom-width: 2px;
      border-radius: 3px;
      background: var(--surface-1);
      font-family: Consolas, monospace;
      font-size: 11px;
    }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: var(--hairline-strong) padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-tertiary) padding-box; }

    /* 二次确认 */
    .confirm-points {
      margin: 0 0 12px;
      padding: 10px 12px 10px 28px;
      border-radius: 6px;
      background: var(--surface-1);
      color: var(--ink-muted);
      font-size: 12.5px;
      line-height: 1.8;
    }

    .confirm-files {
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      background: var(--canvas);
    }

    .confirm-files-head {
      display: flex;

      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .confirm-files ol {
      max-height: 170px;
      margin: 0;
      padding: 6px 12px 6px 36px;
      overflow: auto;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.75;
      word-break: break-all;
    }

    .confirm-files-more {
      padding: 6px 12px;
      border-top: 1px dashed var(--hairline);
      color: var(--ink-subtle);
      font-size: 11.5px;
    }

    .confirm-ack {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px dashed var(--danger);
      border-radius: 6px;
      background: #fbeeea;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.6;
      cursor: pointer;
    }

    .confirm-ack.warning { border-color: #b8860b; background: var(--warning-bg); }
    .confirm-ack input { width: 15px; height: 15px; margin-top: 3px; accent-color: var(--primary); cursor: pointer; }

    /* 操作日志 */
    .modal.modal-wide { width: 94%; max-width: 1040px; max-height: 88vh; }
    .log-shell { display: flex; flex-direction: column; gap: 18px; }

    .log-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .log-section-head h4 {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-family: 'SimSun', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .log-section-head h4::before {
      content: '';
      width: 3px;
      height: 13px;
      border-radius: 2px;
      background: var(--primary);
    }

    .log-section-head span { color: var(--ink-subtle); font-size: 11.5px; }

    .log-tasks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
      max-height: 170px;
      padding: 2px;
      overflow: auto;
    }

    .log-task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      background: var(--surface-1);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .log-task:hover { border-color: var(--hairline-strong); box-shadow: var(--shadow-sm); }

    .log-task-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: var(--task-color);
      color: var(--seal-ink);
      font-family: var(--seal-font);
      font-size: 15px;
      font-weight: 700;
      transform: rotate(-4deg);
    }

    .log-task-info { min-width: 0; }
    .log-task-info b { display: block; color: var(--ink); font-size: 12.5px; }
    .log-task-info small { display: block; overflow: hidden; color: var(--ink-subtle); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .log-body {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 16px;
      height: min(560px, 58vh);
      min-height: 320px;
    }

    .log-dates {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 10px;
      overflow: auto;
      border-right: 1px solid var(--hairline);
    }

    .log-date-item {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--ink-muted);
      font-family: Consolas, 'Microsoft YaHei', monospace;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .log-date-item:hover { background: var(--surface-1); color: var(--ink); }
    .log-date-item.active { background: var(--primary-muted); color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); font-weight: 600; }
    .log-date-item small { color: var(--ink-subtle); font-family: 'Microsoft YaHei', sans-serif; font-size: 10.5px; font-weight: 400; }

    .log-today {
      padding: 0 6px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 10px;
      font-weight: 400;
    }

    .log-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .log-toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .log-search { position: relative; flex: 1 1 auto; min-width: 0; }

    .log-search svg {
      position: absolute;
      top: 50%;
      left: 9px;
      width: 14px;
      height: 14px;
      color: var(--ink-tertiary);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .log-search input {
      width: 100%;
      padding: 6px 10px 6px 29px;
      border: 1px solid var(--hairline-strong);
      border-radius: 6px;
      background: var(--canvas);
      color: var(--ink);
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .log-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(192,57,43,0.12); }
    .log-search-count { color: var(--ink-subtle); font-size: 11px; white-space: nowrap; }

    .log-filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }

    .log-filter {
      padding: 3px 10px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: var(--canvas);
      color: var(--ink-muted);
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .log-filter:hover { border-color: var(--hairline-strong); color: var(--ink); }
    .log-filter.active { border-color: var(--ink); background: var(--ink); color: var(--canvas); }
    .log-filter em { margin-left: 4px; font-style: normal; opacity: 0.65; }

    .log-content {
      flex: 1;
      min-height: 0;
      padding: 4px 6px 4px 0;
      overflow: auto;
    }

    .log-entry {
      position: relative;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 14px;
      padding-bottom: 12px;
    }

    .log-entry::before {
      content: '';
      position: absolute;
      top: 16px;
      bottom: 0;
      left: 68px;
      width: 1px;
      background: var(--hairline-strong);
    }

    .log-entry:last-of-type::before { display: none; }

    .log-entry-time {
      padding-top: 9px;
      color: var(--ink-subtle);
      font-family: Consolas, monospace;
      font-size: 12px;
      text-align: right;
    }

    .log-entry-card {
      position: relative;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--hairline);
      border-left: 3px solid var(--log-color);
      border-radius: 0 6px 6px 0;
      background: var(--surface-1);

    .log-entry-card::before {
      content: '';
      position: absolute;
      top: 12px;
      left: -17px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--log-color);
      border-radius: 50%;
      background: var(--canvas);

    .log-entry-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .log-entry-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 1px 9px 1px 2px;
      border-radius: 999px;
      background: var(--log-soft);
      color: var(--log-color);
      font-size: 12px;
      font-weight: 600;
